# Audrey 2.0 — compose for the two services we rebuild often.
#
# Scope: only `audrey-ai` and `custom-tools`. `ollama`, `qdrant`, and
# `open-webui` stay under the Unraid UI so the GPU passthrough +
# persistence config stays where you've been managing it.
#
# Usage (on Unraid, from /mnt/user/appdata/audrey_ai_2.0):
#   docker compose up -d --build audrey-ai      # rebuild + restart audrey
#   docker compose up -d --build custom-tools   # rebuild + restart tools
#   docker compose up -d --build                # both (audrey-eval excluded)
#   docker compose logs -f audrey-ai            # tail logs
#   docker compose down audrey-ai               # stop + remove
#
# The `audrey-eval` service below is BUILD-ONLY (profile `eval`), so a bare
# `up`/`up --build` never starts it — it's a throwaway container run on demand
# by scripts/eval-onbox.sh (`docker run` with runtime args + a locked-down
# secret mount), not a long-running service. Build it via the profile:
#   docker compose --profile eval build audrey-eval
# One-shot "rebuild everything" (services + eval image, then dangling prune):
#   docker compose up -d --build && docker compose --profile eval build audrey-eval && docker image prune -f
#
# ⚠️ `prune -f`, NEVER `prune -a -f`. `-a` deletes every image without a
# RUNNING container, and audrey-eval is build-only — so `-a` deletes the image
# in the same breath that built it, and the next eval run dies with "image
# audrey-eval:latest not built". Cost an hour on 2026-08-10/11.
#
# The `ollama-net` network is declared `external: true` because it was
# created out-of-band by the Unraid-managed `ollama` container. Don't let
# compose try to recreate it.

services:
  audrey-ai:
    build:
      context: .
      dockerfile: docker/audrey.Dockerfile
    image: audrey-ai:latest
    container_name: audrey-ai
    labels:
      net.unraid.docker.icon: "${AUDREY_REPO_DIR:-/mnt/user/appdata/audrey_ai_2.0}/images/audrey2.png"
    restart: unless-stopped
    # Audrey discovers tools at startup by GETting custom-tools'
    # /openapi.json. If audrey starts before custom-tools is ready,
    # discovery returns 0 tools and never re-tries (until manual
    # `POST /v1/tools/rediscover`). Wait for custom-tools to be healthy.
    depends_on:
      custom-tools:
        condition: service_healthy
    networks:
      - ollama-net
      # Phase 34: media-worker reaches audrey-ai here and ONLY here. It is not
      # on ollama-net, so it cannot resolve or route to `ollama` even if some
      # future edit hands it an address. See the media-worker stanza below.
      - media-net
      # Phase 41: same job for media-fetcher. A separate network from media-net
      # because that one is `internal: true` and the fetcher's entire purpose
      # requires egress — putting it there would be the one thing it cannot do.
      - fetch-net
    # Published to the host LAN. Safe since Phase 31 (2026-07-27): the KB query
    # routes (`/v1/kb/query`, `/v1/kb/query/image`) are gated by
    # `resolve_kb_caller` — custom-tools' `X-Audrey-Service-Token` may act-as
    # `req.user`; a direct user bearer is pinned to its own email; anything else
    # 401s. LAN exposure no longer leaks other users' uploads. Consumers:
    #   - OWUI → Audrey  (http://audrey-ai:8000/v1, container DNS)
    #   - Prometheus     (scrape target audrey-ai:8000, monitoring/ compose)
    #   - Hermes LAN passthrough, e.g. Claudette (audrey_passthrough/* →
    #     192.168.1.11:8000/v1) — REQUIRES this publish; the 2026-07-18 review
    #     omitted this consumer and unpublishing broke it.
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TZ: America/Denver
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      # TOOL_SERVERS and KB_DATASET_PATHS deliberately omitted — the
      # YAML (`config.yaml`'s `tools.servers` and `kb.dataset_paths`) is
      # the source of truth. Set those env vars in `.env` only if you
      # need to override the YAML for a specific deployment.
      # Auto-reingest dataset files when they change. The watcher
      # observes KB_DATASET_PATHS and pushes through ingest on
      # create/modify/move/delete. Off by default historically; turned
      # on in Phase 27 once the on_deleted handler landed.
      KB_WATCHER_ENABLED: ${KB_WATCHER_ENABLED:-1}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /mnt/user/appdata/runtime:/data
      - /mnt/user/appdata/clip-cache:/root/.cache/clip
      - /mnt/user/knowledge:/datasets
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  custom-tools:
    build:
      context: .
      dockerfile: docker/custom-tools.Dockerfile
    image: audrey-custom-tools
    container_name: custom-tools
    labels:
      net.unraid.docker.icon: "${AUDREY_REPO_DIR:-/mnt/user/appdata/audrey_ai_2.0}/images/toolbox.png"
    restart: unless-stopped
    networks:
      - ollama-net
    # No host `ports:` publish (security review Item 1, 2026-07-18). EVERY
    # custom-tools route is unauthenticated and several take a caller-supplied
    # `user` (`/memory_search`, `/memory_recall`, `/memory_store`, `/kb_search`,
    # `/chat_history_search`). Publishing 8001 to the host let any LAN device
    # read or write ANY user's memory and chat history by naming their email.
    # The only legitimate caller is Audrey, over ollama-net DNS:
    #   Audrey → custom-tools  (config.yaml tools.servers = http://custom-tools:8001)
    # The in-container healthcheck hits 127.0.0.1:8001 and is unaffected.
    # Debug access from the laptop, if ever needed: tunnel it like audrey-ai above.
    env_file:
      - .env
    environment:
      TZ: America/Denver
      AUDREY_URL: ${AUDREY_URL:-http://audrey-ai:8000}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      MEMORY_COLLECTION: ${MEMORY_COLLECTION:-kb_memory}
      MEMORY_EMBED_MODEL: ${MEMORY_EMBED_MODEL:-nomic-embed-text}
      MEMORY_SIMILARITY_THRESHOLD: ${MEMORY_SIMILARITY_THRESHOLD:-0.5}
    volumes:
      - /mnt/user/appdata/custom-tools:/app/data
    # Healthcheck so audrey-ai's depends_on(condition=service_healthy)
    # actually has something to wait on. The image has no `curl` binary,
    # so use python (which is the entrypoint and guaranteed present).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Phase 34: the ffmpeg sidecar. Claims video jobs from audrey-ai over HTTP,
  # demuxes audio, posts the result back. No ports, no model access, no
  # database — it is an HTTP client that happens to run ffmpeg.
  media-worker:
    build:
      context: .
      dockerfile: docker/media-worker.Dockerfile
    image: media-worker:latest
    container_name: media-worker
    restart: unless-stopped
    # Docker's default is 10s, after which a stop becomes SIGKILL. The worker
    # drains on SIGTERM — it finishes the job in hand rather than abandoning
    # it to a lease expiry — but only if it is given long enough to. A demux
    # is seconds; Phase 35's whisper pass will be minutes, and at the default
    # every `compose stop` mid-transcription would throw that work away and
    # wait out `lease_minutes` before anything retried it.
    stop_grace_period: 180s
    depends_on:
      audrey-ai:
        condition: service_healthy
    # ONLY media-net, and media-net is `internal: true`. This is the fairness
    # invariant from Phase 34 expressed as topology rather than as a promise:
    # CPU work is isolated in this container, but GPU work must keep going
    # through audrey-ai's passthrough so `FairLocalGate` and
    # `UserInflightRegistry` still apply. A worker that reaches Ollama directly
    # bypasses both — silently, and only under load.
    #
    # A separate bridge network is NOT enough on its own, which the first
    # on-box run proved: ollama publishes 11434 on the host, so any container
    # with ordinary egress routes to 192.168.1.11:11434 regardless of which
    # docker network it is on. Container DNS isolation is not network
    # isolation. `internal: true` is what removes the route.
    networks:
      - media-net
    # NOT `env_file: .env`. That file carries OLLAMA_HOST among other things,
    # and injecting the whole of it handed this container the very address the
    # design says it must not have. Name the one variable it needs instead —
    # compose still reads .env for `${...}` interpolation, so the token comes
    # from the same place, without the rest riding along.
    environment:
      TZ: America/Denver
      AUDREY_ENDPOINT: http://audrey-ai:8000
      POLL_SECONDS: ${MEDIA_POLL_SECONDS:-10}
      KB_SERVICE_TOKEN: ${KB_SERVICE_TOKEN:?media-worker needs KB_SERVICE_TOKEN in .env}
      # Phase 35. WHISPER_MODEL can only name a model baked into the image at
      # build time (WHISPER_BAKE in the Dockerfile) — the worker has no network
      # to fetch another. TRANSCRIBE_BUDGET_S must stay comfortably under
      # kb.video.lease_minutes, or a slow transcription gets swept and
      # re-claimed while it is still running: the same file transcribed twice
      # at once, until its attempts run out.
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      TRANSCRIBE_BUDGET_S: ${TRANSCRIBE_BUDGET_S:-1440}
      # Phase 36. A ceiling on the visual pass, not an entitlement: the worker
      # cuts it to whatever the lease has left, because 1440s of transcription
      # plus 900s of frames is 39 minutes against a 30-minute lease. The
      # remaining lease arrives on the claim as `lease_seconds`, so this stays
      # a ceiling rather than having to know kb.video.lease_minutes itself.
      #
      # The frame *settings* — interval, keyframes_max, width, dedup distance
      # — deliberately do NOT live here. They ride on the claim from
      # `kb.video.*`, so calibrating a threshold against real footage takes
      # effect on the next job instead of needing a container recreate.
      FRAME_BUDGET_S: ${FRAME_BUDGET_S:-900}
    volumes:
      # Read-only, and the same path audrey-ai uses, so the `path` returned by
      # /v1/files/jobs/claim resolves unchanged inside this container. If these
      # ever diverge the worker gets a valid-looking path it cannot open.
      #
      # Read-only matters beyond tidiness: Phase 33's single-writer argument
      # covers sqlite, and a writable mount here would quietly make the same
      # claim untrue for the upload bytes themselves.
      - /mnt/user/appdata/runtime:/data:ro
    # ffmpeg on a large file is CPU-hungry and this box also serves chat.
    # Cap it so a 300 MB video can't starve audrey-ai of cores. Raise it if
    # Phase 35's whisper turns out to be the bottleneck it probably is.
    cpus: 2.0

  # Phase 41: the yt-dlp sidecar. Claims download jobs from audrey-ai over HTTP,
  # fetches the video into a staging directory, posts the result back. No ports,
  # no model access, no database — and, unlike the other two, internet egress.
  media-fetcher:
    build:
      context: .
      dockerfile: docker/media-fetcher.Dockerfile
    image: media-fetcher:latest
    container_name: media-fetcher
    restart: unless-stopped
    # A download in flight is finished rather than abandoned: `Stopping` is
    # checked between jobs, so a stop lands after the current one. 300s covers
    # a normal fetch; anything longer is SIGKILLed, which is safe by design —
    # the lease expires, Audrey sweeps the row back to `fetch_pending` and the
    # staging sweep deletes the partial file. Costly, not broken.
    stop_grace_period: 300s
    depends_on:
      audrey-ai:
        condition: service_healthy
    # fetch-net is an ordinary bridge, NOT `internal: true`, because a
    # downloader without egress is a contradiction. It exists so this container
    # can reach audrey-ai by DNS instead of by the host's published port.
    #
    # **Be honest about what this does and does not isolate.** It keeps the
    # fetcher off ollama-net, so `ollama` does not resolve and no config here
    # hands it an address. It does NOT remove the route: ollama publishes 11434
    # on the host, and any container with ordinary egress can reach
    # 192.168.1.11:11434 — the lesson phase 34 learned on the box. media-worker
    # is protected by `internal: true` removing the default route entirely, and
    # that protection is unavailable to a container whose job is to download
    # things from the internet. What is left is that nothing here knows the
    # address, which is weaker, and is the price of the feature.
    networks:
      - fetch-net
    # NOT `env_file: .env` — same rule as media-worker, and it bites harder
    # here. That file carries OLLAMA_HOST, and this is the container that
    # actually has a route to it.
    environment:
      TZ: America/Denver
      AUDREY_ENDPOINT: http://audrey-ai:8000
      POLL_SECONDS: ${FETCH_POLL_SECONDS:-10}
      KB_SERVICE_TOKEN: ${KB_SERVICE_TOKEN:?media-fetcher needs KB_SERVICE_TOKEN in .env}
      # The metadata pass only. The download's budget is the lease, and arrives
      # on the claim from `kb.fetch.lease_minutes` — the caps that matter are
      # config-driven for the same reason the frame settings are.
      PROBE_TIMEOUT_S: ${FETCH_PROBE_TIMEOUT_S:-120}
    volumes:
      # ONE directory, read-write, and that is the point. The fetcher writes
      # downloads here and audrey-ai moves them into the user's directory after
      # checking them, so this container never has write access to stored files
      # — see `_fetch_stage_dir` in routes/files.py.
      #
      # The path inside the container must equal the `stage_dir` audrey-ai
      # reports on the claim, which is `<kb.upload_root>/.staging`.
      #
      # Create it before the first `up`, or the daemon makes it root-owned and
      # the first download fails on permissions until audrey-ai's next claim
      # chmods it:
      #   mkdir -p /mnt/user/appdata/runtime/uploads/.staging
      - /mnt/user/appdata/runtime/uploads/.staging:/data/uploads/.staging
    # yt-dlp is network-bound; the CPU here is ffmpeg remuxing the merged
    # streams into mp4, which is a stream copy rather than a re-encode. Capped
    # anyway so a pathological file cannot starve audrey-ai of cores.
    cpus: 2.0

  # Build-only: the live-eval harness image (see Dockerfile.eval + Phase 27).
  # `profiles: [eval]` keeps it OUT of the default `up`/`up --build` run graph,
  # so it never runs as a phantom service — but `docker compose --profile eval
  # build audrey-eval` builds it in-graph, replacing the standalone
  # `docker build -f Dockerfile.eval ...`. It is deliberately run, not up'd:
  # scripts/eval-onbox.sh does the `docker run` with per-run --model/--cases/
  # --save-file args and mounts the OWUI sk- key via a restricted --env-file at
  # run time (never baked into the image, never committed here). No command,
  # env_file, ports, or restart here — this stanza exists purely to build.
  audrey-eval:
    profiles: ["eval"]
    build:
      context: .
      dockerfile: Dockerfile.eval
    image: audrey-eval:latest

networks:
  ollama-net:
    external: true
  # Phase 34: compose-managed, unlike ollama-net. It exists only to join
  # media-worker to audrey-ai, so nothing outside this file needs to know
  # about it and compose may create and destroy it freely.
  #
  # `internal: true` removes the default route, not just the DNS entry. The
  # first on-box run showed why that distinction matters: `ollama` did not
  # resolve, and the worker still reached 192.168.1.11:11434 — the published
  # port on the host — because a normal bridge has NAT egress. Being on a
  # different docker network only isolates you from other containers' names,
  # never from the host's own published ports.
  #
  # audrey-ai is on this network too and keeps its egress from ollama-net,
  # which has the only gateway of the two. Verify after any change here:
  #   docker exec audrey-ai python3 -c "import socket;print(socket.gethostbyname('ollama'))"
  #
  # Consequence for Phase 35: whisper weights must be baked into the image at
  # build time. The worker cannot download anything at runtime, on purpose.
  media-net:
    driver: bridge
    internal: true

  # Phase 41: joins media-fetcher to audrey-ai. An ordinary bridge — see the
  # media-fetcher stanza for why `internal: true` is not available here and
  # what is lost by that.
  fetch-net:
    driver: bridge
