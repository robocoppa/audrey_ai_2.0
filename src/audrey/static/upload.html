<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Audrey — Knowledge Upload</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f1115;
      --panel: #181b22;
      --panel2: #1f232c;
      --text: #e6e8ec;
      --muted: #8b95a6;
      --accent: #7aa7ff;
      --danger: #ff6b6b;
      --ok: #6fd18d;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 32px;
      max-width: 960px; margin-inline: auto;
    }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    .who { font-size: 0.85rem; color: var(--muted); margin: 0 0 20px; }
    .who strong { color: var(--text); }
    #drop {
      border: 2px dashed var(--border); border-radius: 12px;
      padding: 48px; text-align: center; background: var(--panel);
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    #drop.hover { border-color: var(--accent); background: var(--panel2); }
    #drop p { margin: 0; color: var(--muted); }
    #drop strong { color: var(--text); }
    #picker { display: none; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }

    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td {
      text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { color: var(--muted); font-weight: 500; }
    tr.pending td { color: var(--muted); }
    tr.err td { color: var(--danger); }
    tr.err td:nth-child(5) { white-space: normal; word-break: break-word; }
    td.right { text-align: right; }

    button {
      background: var(--panel2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 0.85rem;
    }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button:hover { background: var(--panel); }

    #status { margin-top: 12px; font-size: 0.85rem; }
    #status div { margin-top: 4px; }
    #status div.ok { color: var(--ok); }
    #status div.err { color: var(--danger); }
    #status .bar {
      margin-top: 6px; height: 6px; border-radius: 3px;
      background: var(--panel2); overflow: hidden;
    }
    #status .bar > span {
      display: block; height: 100%; width: 0;
      background: var(--accent); transition: width .12s linear;
    }

    .quota { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Audrey · Knowledge Upload</h1>
  <p class="sub">
    Upload files into your private knowledge collection.
    <span id="supported">Loading supported formats…</span>
  </p>

  <p class="who">Signed in as <strong id="who">…</strong> · <a href="/" id="signout">sign out</a></p>

  <div id="drop">
    <p><strong>Drop files here</strong> or click to select.</p>
    <p class="hint" id="hint">Max 50 MB per file. Quota per user applies.</p>
    <input id="picker" type="file" multiple />
  </div>

  <div id="status"></div>

  <h2 style="margin-top: 32px; font-size: 1.1rem;">Your files</h2>
  <div class="quota" id="quota"></div>
  <table>
    <thead>
      <tr>
        <th>Filename</th><th>Mime</th><th class="right">Size</th>
        <th class="right">Chunks</th><th>Uploaded</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="6" style="color: var(--muted);">—</td></tr></tbody>
  </table>

<script>
(() => {
  // OWUI stores its JWT here after login. Same-origin via cloudflared is
  // what lets this page read localStorage — that's why /upload is served
  // from the audrey domain rather than as a separate origin.
  const token = localStorage.getItem("token");
  if (!token) {
    window.location.href = "/";
    return;
  }

  const drop = document.getElementById("drop");
  const picker = document.getElementById("picker");
  const status = document.getElementById("status");
  const rows = document.getElementById("rows");
  const quota = document.getElementById("quota");
  const who = document.getElementById("who");
  const signout = document.getElementById("signout");
  const hint = document.getElementById("hint");
  const supported = document.getElementById("supported");

  // Populated by refreshList() from GET /v1/files. Null until that lands,
  // in which case the pre-check fails OPEN and defers to the server — a
  // client that can't see the limits must never be the reason an upload
  // is refused.
  let limits = null;
  let storedBytes = 0;

  signout.addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("token");
    window.location.href = "/";
  });

  async function authedFetch(url, opts = {}) {
    const headers = new Headers(opts.headers || {});
    headers.set("Authorization", `Bearer ${token}`);
    const r = await fetch(url, { ...opts, headers });
    if (r.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "/";
      throw new Error("unauthorized");
    }
    return r;
  }

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + " MB";
    return (n / (1024 * 1024 * 1024)).toFixed(2) + " GB";
  }

  function clearLog() { status.replaceChildren(); }

  // One line per file. Returns the node so uploadOne can rewrite "Uploading…"
  // into the outcome in place rather than stacking two lines per file. The
  // message lives in its own span so a progress bar can sit alongside it
  // without the next text update wiping it out.
  function logLine(msg, cls) {
    const line = document.createElement("div");
    const text = document.createElement("span");
    text.className = "msg";
    text.textContent = msg;
    line.appendChild(text);
    if (cls) line.className = cls;
    status.appendChild(line);
    return line;
  }

  function setLine(line, msg, cls) {
    line.querySelector(".msg").textContent = msg;
    line.className = cls || "";
  }

  /** Add a progress bar to a line and return a setter for its fill.
   *
   * Only chunked uploads get one. fetch() reports nothing about how much of a
   * request body has gone out, so a single-shot upload has no real progress to
   * report and a bar that advanced on its own would be an invention.
   */
  function attachBar(line) {
    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("span");
    bar.appendChild(fill);
    line.appendChild(bar);
    return (done, total) => {
      fill.style.width = `${Math.round((done / total) * 100)}%`;
    };
  }

  function clearBar(line) {
    const bar = line.querySelector(".bar");
    if (bar) bar.remove();
  }

  function extOf(name) {
    const i = name.lastIndexOf(".");
    return i > 0 ? name.slice(i).toLowerCase() : "";
  }

  /** Reason this file can't be accepted, or null to go ahead.
   *
   * `pending` is the total already committed by earlier files in the same
   * batch — without it, dropping ten files that each individually fit under
   * the remaining quota would pass ten pre-checks and then fail server-side.
   */
  function precheckFailure(file, pending) {
    if (!limits) return null;
    if (file.size === 0) return "the file is empty";
    // Above the single-shot cap the file goes out in parts, so the ceiling
    // that applies is the chunked one — not `max_upload_bytes`, which only
    // bounds what a single request body may carry.
    const ceiling = limits.chunked_max_bytes || limits.max_upload_bytes;
    if (file.size > ceiling) {
      return `${fmtBytes(file.size)} is over the ${fmtBytes(ceiling)} limit`;
    }
    const ext = extOf(file.name);
    if (!ext) return `no file extension — supported: ${limits.allowed_extensions.join(", ")}`;
    if (!limits.allowed_extensions.includes(ext)) {
      return `${ext} is not a supported format — supported: ${limits.allowed_extensions.join(", ")}`;
    }
    const free = limits.max_user_bytes - storedBytes - pending;
    if (file.size > free) {
      return `not enough quota — needs ${fmtBytes(file.size)}, ${fmtBytes(Math.max(0, free))} free `
           + `of ${fmtBytes(limits.max_user_bytes)}`;
    }
    return null;
  }

  /** Turn a failed response into something that names the actual cause.
   *
   * Audrey's own rejections are JSON with a `detail`. Anything else means the
   * response was written by something in front of Audrey — cloudflared or the
   * CDN edge — which is worth saying out loud, because the fix lives in a
   * different place than a limit the app controls.
   */
  async function describeFailure(r, file) {
    const raw = await r.text().catch(() => "");
    let detail = null;
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        detail = parsed && parsed.detail;
        // FastAPI sends a list of error objects for 422s.
        if (detail && typeof detail !== "string") detail = JSON.stringify(detail);
      } catch (_) { /* not JSON — fall through to the edge/opaque cases */ }
    }
    if (detail) return `${file.name} — upload failed (${r.status}): ${detail}`;
    if (r.status === 413) {
      return `${file.name} — upload failed (413): rejected before it reached Audrey. `
           + `The request body exceeded a proxy/CDN limit that sits in front of the app, `
           + `not Audrey's own ${limits ? fmtBytes(limits.max_upload_bytes) : ""} cap.`;
    }
    const snippet = raw.trim().replace(/\s+/g, " ").slice(0, 200);
    return `${file.name} — upload failed (${r.status})`
         + (snippet ? `: ${snippet}` : " with an empty response body.");
  }

  drop.addEventListener("click", () => picker.click());
  picker.addEventListener("change", (e) => handleFiles(e.target.files));
  drop.addEventListener("dragover", (e) => {
    e.preventDefault(); drop.classList.add("hover");
  });
  drop.addEventListener("dragleave", () => drop.classList.remove("hover"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault(); drop.classList.remove("hover");
    handleFiles(e.dataTransfer.files);
  });

  async function handleFiles(files) {
    const batch = Array.from(files);
    if (!batch.length) return;
    clearLog();

    // The pre-check needs the limits and the current quota usage. On a cold
    // page that hasn't finished its first list call, wait for one.
    if (!limits) await refreshList();

    let pending = 0;
    let uploaded = 0;
    for (const file of batch) {
      const problem = precheckFailure(file, pending);
      if (problem) {
        logLine(`Skipped ${file.name} (${fmtBytes(file.size)}) — ${problem}.`, "err");
        continue;
      }
      pending += file.size;
      if (await uploadOne(file)) uploaded += 1;
    }

    // Re-picking the same file after fixing it fires no `change` event unless
    // the input is cleared first, which makes a rejection look like a hang.
    picker.value = "";
    if (uploaded) await refreshList();
  }

  async function uploadOne(file) {
    const line = logLine(`Uploading ${file.name} (${fmtBytes(file.size)})…`);
    try {
      // Anything a single request body can still carry goes the simple way.
      // Above that the edge proxy would refuse the body outright, so the
      // file has to travel as parts.
      const chunked = limits && file.size > limits.max_upload_bytes;
      const r = chunked ? await sendChunked(file, line) : await sendSingle(file);
      clearBar(line);
      if (!r.ok) {
        setLine(line, await describeFailure(r, file), "err");
        return false;
      }
      const body = await r.json();
      setLine(line, body.status === "pending"
        // Say plainly that it is stored but not yet searchable. Reporting
        // "0 chunks" as a success would read as a silent failure.
        ? `Stored ${body.filename} — awaiting processing, not searchable yet.`
        : `Uploaded ${body.filename} → ${body.chunks} chunk${body.chunks === 1 ? "" : "s"}.`,
        "ok");
      return true;
    } catch (e) {
      if (String(e.message) === "unauthorized") return false;
      clearBar(line);
      // fetch() rejects rather than resolving when the transport itself
      // fails, so there is no status to report — a connection reset partway
      // through a large body is the usual cause.
      setLine(line, `${file.name} — upload failed: connection error (${e}).`, "err");
      return false;
    }
  }

  function sendSingle(file) {
    const fd = new FormData();
    fd.append("file", file);
    return authedFetch(`/v1/files`, { method: "POST", body: fd });
  }

  /** Slice the file and send it part by part, then ask the server to assemble.
   *
   * Returns the /complete response, so the caller handles success and failure
   * identically for both transports. A non-ok response from any earlier step
   * is returned as-is for `describeFailure` to explain.
   */
  async function sendChunked(file, line) {
    const open = await authedFetch(`/v1/files/upload-sessions`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename: file.name, total_bytes: file.size }),
    });
    if (!open.ok) return open;
    const { upload_id, part_size, parts_total } = await open.json();
    const setProgress = attachBar(line);

    for (let n = 0; n < parts_total; n++) {
      const slice = file.slice(n * part_size, (n + 1) * part_size);
      const put = await authedFetch(
        `/v1/files/upload-sessions/${encodeURIComponent(upload_id)}/parts/${n}`,
        { method: "PUT", body: slice },
      );
      if (!put.ok) return put;
      const done = n + 1;
      setProgress(done, parts_total);
      const pct = Math.round((done / parts_total) * 100);
      setLine(line,
        `Uploading ${file.name} (${fmtBytes(file.size)}) — ${pct}% `
        + `(part ${done}/${parts_total})…`);
    }

    // The bar stays full through assembly: the bytes are all across, and the
    // server-side concatenation has no progress to report.
    setLine(line, `Processing ${file.name}…`);
    return authedFetch(
      `/v1/files/upload-sessions/${encodeURIComponent(upload_id)}/complete`,
      { method: "POST" },
    );
  }

  async function deleteOne(fileId) {
    if (!confirm(`Delete ${fileId}? This removes all chunks.`)) return;
    clearLog();
    try {
      const r = await authedFetch(`/v1/files/${encodeURIComponent(fileId)}`, { method: "DELETE" });
      if (!r.ok) {
        logLine(`Delete failed (${r.status}).`, "err");
      } else {
        logLine(`Deleted.`, "ok");
      }
      await refreshList();
    } catch (e) {
      if (String(e.message) === "unauthorized") return;
      logLine(`Delete failed: ${e}`, "err");
    }
  }

  // Poll only while something is actually moving. A row goes
  // pending → processing → ready without the page hearing about it, and the
  // list otherwise refreshes only when you act on it — so a 458-second ingest
  // is indistinguishable from a stalled one until you reload by hand.
  //
  // Deliberately NOT a progress protocol. Reporting stage transitions would
  // mean the worker posting over HTTP, a sibling of `ingest_result`, and lease
  // logic that tolerates partial updates — a lot of surface for "whisper is
  // done, frames are next". Elapsed time against a known typical duration
  // answers the question a user actually has, which is whether to wait.
  const WATCH_INTERVAL_MS = 5000;
  let watchTimer = null;

  function scheduleWatch(files) {
    const moving = files.some(
      f => f.status === "pending" || f.status === "processing");
    if (moving) {
      if (watchTimer === null) watchTimer = setInterval(watchTick, WATCH_INTERVAL_MS);
    } else if (watchTimer !== null) {
      clearInterval(watchTimer);
      watchTimer = null;
    }
  }

  function watchTick() {
    // A hidden tab is nobody watching. Browsers throttle background timers
    // anyway, so the poll would land late and irregularly; skipping it means
    // a tab left open overnight costs the server nothing, and the
    // visibilitychange handler catches up the moment it is looked at again.
    if (document.visibilityState === "visible") refreshList();
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && watchTimer !== null) refreshList();
  });

  // Single-flight. On a slow link the 5s timer would otherwise stack requests
  // that each redraw the table underneath the last. Returning the in-flight
  // promise rather than bailing keeps `await refreshList()` in handleFiles
  // meaning what it says — it must not resolve before `limits` is populated.
  let refreshInFlight = null;

  function refreshList() {
    if (refreshInFlight) return refreshInFlight;
    refreshInFlight = fetchList().finally(() => { refreshInFlight = null; });
    return refreshInFlight;
  }

  async function fetchList() {
    try {
      const r = await authedFetch(`/v1/files`);
      if (!r.ok) {
        rows.innerHTML = `<tr><td colspan="6">Error: ${r.status}</td></tr>`;
        return;
      }
      const body = await r.json();
      if (body.server_time) {
        const serverNow = Date.parse(body.server_time);
        if (!Number.isNaN(serverNow)) serverSkewMs = Date.now() - serverNow;
      }
      who.textContent = body.user;
      storedBytes = body.total_bytes;
      scheduleWatch(body.files);
      if (body.limits) applyLimits(body.limits);
      quota.textContent =
        `Stored: ${fmtBytes(body.total_bytes)}`
        + (limits ? ` of ${fmtBytes(limits.max_user_bytes)}` : "")
        + ` across ${body.files.length} file${body.files.length === 1 ? "" : "s"}.`;
      if (body.files.length === 0) {
        rows.innerHTML = `<tr><td colspan="6" style="color: var(--muted);">No files yet.</td></tr>`;
        return;
      }
      rows.innerHTML = body.files.map(f => `
        <tr class="${rowClass(f)}">
          <td>${escapeHtml(f.filename)}</td>
          <td>${escapeHtml(f.mime)}</td>
          <td class="right">${sizeCell(f)}</td>
          <td class="right">${f.status === "ready" ? f.chunks : "—"}</td>
          <td>${statusCell(f)}</td>
          <td><button class="danger" data-id="${escapeAttr(f.file_id)}">delete</button></td>
        </tr>
        ${summaryRow(f)}
      `).join("");
      rows.querySelectorAll("button.danger").forEach(btn =>
        btn.addEventListener("click", () => deleteOne(btn.dataset.id)),
      );
    } catch (e) {
      if (String(e.message) === "unauthorized") return;
      rows.innerHTML = `<tr><td colspan="6">Error: ${e}</td></tr>`;
    }
  }

  // A row that stops moving has to say so. 'pending' and 'processing' both
  // mean not-yet-searchable; 'failed' means it never will be without another
  // upload, and the reason is the only thing that makes that actionable.
  function rowClass(f) {
    if (f.status === "failed") return "err";
    return f.status === "ready" ? "" : "pending";
  }

  // Phase 37. A second row under the file, because "jasonRetirement.mp4 ·
  // 288 MB · ready" tells you nothing you did not already know. Absent for
  // everything that is not a processed video, and absent for a video whose
  // summary call failed — that is a missing field, not an error to surface.
  function summaryRow(f) {
    if (!f.summary) return "";
    return `
      <tr class="summary">
        <td colspan="6" style="color: var(--muted); font-size: 0.9em;
            padding-top: 0; border-top: 0; white-space: pre-wrap;"
          >${escapeHtml(f.summary)}</td>
      </tr>`;
  }

  // Phase 38. A reclaimed video still reports the size it was uploaded at —
  // that is the honest record, and the quota is what changed, not the file.
  // Without saying so here the two numbers simply disagree: 288 MB in the
  // list, nothing against the allowance, and no way to tell that from a bug.
  function sizeCell(f) {
    const size = fmtBytes(f.bytes);
    if (!f.source_freed_at) return size;
    return `<span title="Source reclaimed ${escapeAttr(f.source_freed_at)} —`
      + ` the video is still searchable, but cannot be re-processed."`
      + ` style="text-decoration: line-through; color: var(--muted);"`
      + `>${size}</span>`;
  }

  // Elapsed is measured against the SERVER's clock, not this browser's.
  //
  // `serverSkewMs` is the gap between the two, measured when a list lands. A
  // laptop that slept through a timezone change, or is simply minutes out,
  // would otherwise render "processing for 47 hours" or a negative — both of
  // which read as a broken job queue rather than a wrong clock, and send
  // someone to debug the worker. Null until a response carries `server_time`.
  let serverSkewMs = null;

  function fmtElapsed(seconds) {
    const s = Math.max(0, Math.round(seconds));
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ${String(s % 60).padStart(2, "0")}s`;
    return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
  }

  /** Seconds since `stamp` on the server's clock, or null if unreadable.
   *
   * A row cannot have started in the future, so a negative means the clocks
   * disagree by more than the skew correction covers; fmtElapsed clamps it to
   * 0, which is the honest degradation.
   */
  function elapsedSince(stamp) {
    if (!stamp) return null;
    const started = Date.parse(stamp);
    if (Number.isNaN(started)) return null;
    return (Date.now() - (serverSkewMs || 0) - started) / 1000;
  }

  function statusCell(f) {
    if (f.status === "ready") return escapeHtml(f.uploaded_at);
    if (f.status === "processing") {
      // `leased_at` is when a worker claimed it. A nine-minute video takes
      // ~458s, so a bare "processing…" gives no way to tell a job that is
      // working from one that has hung — which is the question actually
      // being asked.
      const secs = elapsedSince(f.leased_at);
      return secs === null ? "processing…" : `processing — ${fmtElapsed(secs)}`;
    }
    if (f.status === "failed") {
      return f.failure_reason
        ? `failed — ${escapeHtml(f.failure_reason)}`
        : "failed";
    }
    // Queued but not started: measure from upload instead. "Queued 6m" and
    // "processing 6m" mean different things — behind other work versus being
    // worked on — and conflating them makes a backlog look like a stall.
    const secs = elapsedSince(f.uploaded_at);
    return secs === null ? "pending" : `queued — ${fmtElapsed(secs)}`;
  }

  // Server-published limits drive the copy too, so the page can't advertise
  // a cap that config.yaml no longer sets.
  function applyLimits(next) {
    limits = next;
    const ceiling = limits.chunked_max_bytes || limits.max_upload_bytes;
    hint.textContent =
      `Max ${fmtBytes(ceiling)} per file · `
      + `${fmtBytes(limits.max_user_bytes)} total per user. `
      + `Files over ${fmtBytes(limits.max_upload_bytes)} upload in parts.`;
    supported.textContent =
      `Supported: ${limits.allowed_extensions.join(", ")}. `
      + `Video is stored but not searchable until processing lands.`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  refreshList();
})();
</script>
</body>
</html>
