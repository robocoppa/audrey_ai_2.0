<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Audrey — Knowledge Upload</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f1115;
      --panel: #181b22;
      --panel2: #1f232c;
      --text: #e6e8ec;
      --muted: #8b95a6;
      --accent: #7aa7ff;
      --danger: #ff6b6b;
      --ok: #6fd18d;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 32px;
      max-width: 960px; margin-inline: auto;
    }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    .who { font-size: 0.85rem; color: var(--muted); margin: 0 0 20px; }
    .who strong { color: var(--text); }
    /* Deliberately a link that looks like a button rather than a real button.
       It navigates, so middle-click and open-in-new-tab should both work —
       which they do for an anchor and do not for anything driven by a click
       handler.

       Fixed to the viewport corner, not absolute: the file table below grows
       without limit, and Home is the control someone reaches for when they are
       lost — which is exactly when they have scrolled. No margin, because it
       is out of flow; the icon carries its own name via aria-label, since
       there is no visible text to read. */
    a.home {
      position: fixed; top: 16px; right: 16px; z-index: 10;
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; padding: 0;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--panel); color: var(--muted);
      text-decoration: none;
      transition: color .15s, border-color .15s;
    }
    a.home:hover { color: var(--text); border-color: var(--muted); }
    a.home:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    a.home svg { width: 18px; height: 18px; display: block; }
    /* The body is a centred 960px column, so on a wide screen the button sits
       out at the viewport edge. Below that the column meets the edge and the
       32px body padding is all that separates them — tighten so it does not
       crowd the heading. */
    @media (max-width: 1024px) {
      a.home { top: 12px; right: 12px; }
    }
    #drop {
      border: 2px dashed var(--border); border-radius: 12px;
      padding: 48px; text-align: center; background: var(--panel);
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    #drop.hover { border-color: var(--accent); background: var(--panel2); }
    #drop p { margin: 0; color: var(--muted); }
    #drop strong { color: var(--text); }
    #picker { display: none; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }

    /* Phase 41. Above the drop zone rather than beside it: pasting a link and
       dropping a file are alternatives, and a row of controls reads as steps. */
    #urlbar { display: flex; gap: 8px; margin-bottom: 16px; }
    #url {
      flex: 1; background: var(--panel); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font-size: 0.9rem; font-family: inherit;
    }
    #url:focus { outline: none; border-color: var(--accent); }
    #url::placeholder { color: var(--muted); }
    #fetch { padding: 0 16px; }

    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td {
      text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { color: var(--muted); font-weight: 500; }
    tr.pending td { color: var(--muted); }
    tr.err td { color: var(--danger); }
    tr.err td:nth-child(5) { white-space: normal; word-break: break-word; }
    td.right { text-align: right; }

    button {
      background: var(--panel2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 0.85rem;
    }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button:hover { background: var(--panel); }

    #status { margin-top: 12px; font-size: 0.85rem; }
    #status div { margin-top: 4px; }
    #status div.ok { color: var(--ok); }
    #status div.err { color: var(--danger); }
    #status .bar {
      margin-top: 6px; height: 6px; border-radius: 3px;
      background: var(--panel2); overflow: hidden;
    }
    #status .bar > span {
      display: block; height: 100%; width: 0;
      background: var(--accent); transition: width .12s linear;
    }

    .quota { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    a { color: var(--accent); }

    /* Small provenance labels: where a fetched video came from, and what wrote
       its transcript. Muted because they answer a question you only ask when
       something looks wrong. */
    .tag {
      font-size: 0.72rem; color: var(--muted); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 5px; margin-left: 6px; white-space: nowrap;
    }
    .src { font-size: 0.78rem; }

    /* Phase 37's video summary, collapsed by default (2026-08-06). A full
       paragraph under every video turned the list into a wall of prose you had
       to scroll past to find a filename — the opposite of what a file list is
       for. Collapsed it keeps one line of it, so the list stays scannable
       without the summary becoming a thing you have to go and look for. */
    tr.summary td { padding-top: 0; border-top: 0; }
    details.vsum > summary {
      cursor: pointer; color: var(--muted); font-size: 0.85rem;
      /* `display` overrides summary's default `list-item`, which is what
         removes the native triangle in Firefox; the ::-webkit rule below does
         the same for older Safari. Both are needed. */
      display: inline-flex; align-items: baseline; gap: 6px;
      max-width: 100%; user-select: none;
    }
    details.vsum > summary::-webkit-details-marker { display: none; }
    details.vsum > summary::before {
      content: "▸"; display: inline-block; transition: transform .12s ease;
    }
    details.vsum[open] > summary::before { transform: rotate(90deg); }
    details.vsum > summary:hover { color: var(--text); }
    details.vsum .teaser {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Swap the one-line teaser for a plain label once it is open, so the
       first sentence is not printed twice directly above itself. */
    .vsum .label, .vsum[open] .teaser { display: none; }
    .vsum[open] .label { display: inline; }
    details.vsum .prose {
      color: var(--muted); font-size: 0.9em; white-space: pre-wrap;
      margin-top: 6px; padding-left: 18px;
    }
  </style>
</head>
<body>
  <h1>Audrey · Knowledge Upload</h1>
  <p class="sub">
    Upload files into your private knowledge collection.
    <span id="supported">Loading supported formats…</span>
  </p>

  <!-- Substituted by routes/upload_ui.py from OWUI_PUBLIC_URL, or removed
       entirely when that is unset. Not a hidden element toggled by JS: this
       page is opened in a new tab, so a Home link with nowhere to go cannot be
       recovered by going back, and shipping the markup only to hide it leaves
       a button that flashes on slow paints. -->
  <!--HOME-->

  <p class="who">Signed in as <strong id="who">…</strong> · <a href="/" id="signout">sign out</a></p>

  <div id="urlbar">
    <input id="url" type="url" placeholder="Paste a video link — the server downloads it" />
    <button id="fetch">Fetch</button>
  </div>

  <div id="drop">
    <p><strong>Drop files here</strong> or click to select.</p>
    <p class="hint" id="hint">Max 50 MB per file. Quota per user applies.</p>
    <input id="picker" type="file" multiple />
  </div>

  <div id="status"></div>

  <h2 style="margin-top: 32px; font-size: 1.1rem;">Your files</h2>
  <div class="quota" id="quota"></div>
  <table>
    <thead>
      <tr>
        <th>Filename</th><th>Mime</th><th class="right">Size</th>
        <th class="right">Chunks</th><th>Uploaded</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="6" style="color: var(--muted);">—</td></tr></tbody>
  </table>

<script>
(() => {
  // OWUI stores its JWT here after login. Same-origin via cloudflared is
  // what lets this page read localStorage — that's why /upload is served
  // from the audrey domain rather than as a separate origin.
  const token = localStorage.getItem("token");
  if (!token) {
    window.location.href = "/";
    return;
  }

  const drop = document.getElementById("drop");
  const picker = document.getElementById("picker");
  const status = document.getElementById("status");
  const rows = document.getElementById("rows");
  const quota = document.getElementById("quota");
  const who = document.getElementById("who");
  const signout = document.getElementById("signout");
  const hint = document.getElementById("hint");
  const supported = document.getElementById("supported");
  const urlInput = document.getElementById("url");
  const fetchBtn = document.getElementById("fetch");

  // Populated by refreshList() from GET /v1/files. Null until that lands,
  // in which case the pre-check fails OPEN and defers to the server — a
  // client that can't see the limits must never be the reason an upload
  // is refused.
  let limits = null;
  let storedBytes = 0;

  signout.addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("token");
    window.location.href = "/";
  });

  async function authedFetch(url, opts = {}) {
    const headers = new Headers(opts.headers || {});
    headers.set("Authorization", `Bearer ${token}`);
    const r = await fetch(url, { ...opts, headers });
    if (r.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "/";
      throw new Error("unauthorized");
    }
    return r;
  }

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + " MB";
    return (n / (1024 * 1024 * 1024)).toFixed(2) + " GB";
  }

  function clearLog() { status.replaceChildren(); }

  // One line per file. Returns the node so uploadOne can rewrite "Uploading…"
  // into the outcome in place rather than stacking two lines per file. The
  // message lives in its own span so a progress bar can sit alongside it
  // without the next text update wiping it out.
  function logLine(msg, cls) {
    const line = document.createElement("div");
    const text = document.createElement("span");
    text.className = "msg";
    text.textContent = msg;
    line.appendChild(text);
    if (cls) line.className = cls;
    status.appendChild(line);
    return line;
  }

  function setLine(line, msg, cls) {
    line.querySelector(".msg").textContent = msg;
    line.className = cls || "";
  }

  /** Add a progress bar to a line and return a setter for its fill.
   *
   * Only chunked uploads get one. fetch() reports nothing about how much of a
   * request body has gone out, so a single-shot upload has no real progress to
   * report and a bar that advanced on its own would be an invention.
   */
  function attachBar(line) {
    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("span");
    bar.appendChild(fill);
    line.appendChild(bar);
    return (done, total) => {
      fill.style.width = `${Math.round((done / total) * 100)}%`;
    };
  }

  function clearBar(line) {
    const bar = line.querySelector(".bar");
    if (bar) bar.remove();
  }

  function extOf(name) {
    const i = name.lastIndexOf(".");
    return i > 0 ? name.slice(i).toLowerCase() : "";
  }

  /** Reason this file can't be accepted, or null to go ahead.
   *
   * `pending` is the total already committed by earlier files in the same
   * batch — without it, dropping ten files that each individually fit under
   * the remaining quota would pass ten pre-checks and then fail server-side.
   */
  function precheckFailure(file, pending) {
    if (!limits) return null;
    if (file.size === 0) return "the file is empty";
    // Above the single-shot cap the file goes out in parts, so the ceiling
    // that applies is the chunked one — not `max_upload_bytes`, which only
    // bounds what a single request body may carry.
    const ceiling = limits.chunked_max_bytes || limits.max_upload_bytes;
    if (file.size > ceiling) {
      return `${fmtBytes(file.size)} is over the ${fmtBytes(ceiling)} limit`;
    }
    const ext = extOf(file.name);
    if (!ext) return `no file extension — supported: ${limits.allowed_extensions.join(", ")}`;
    if (!limits.allowed_extensions.includes(ext)) {
      return `${ext} is not a supported format — supported: ${limits.allowed_extensions.join(", ")}`;
    }
    const free = limits.max_user_bytes - storedBytes - pending;
    if (file.size > free) {
      return `not enough quota — needs ${fmtBytes(file.size)}, ${fmtBytes(Math.max(0, free))} free `
           + `of ${fmtBytes(limits.max_user_bytes)}`;
    }
    return null;
  }

  /** Turn a failed response into something that names the actual cause.
   *
   * Audrey's own rejections are JSON with a `detail`. Anything else means the
   * response was written by something in front of Audrey — cloudflared or the
   * CDN edge — which is worth saying out loud, because the fix lives in a
   * different place than a limit the app controls.
   */
  async function describeFailure(r, file) {
    const raw = await r.text().catch(() => "");
    let detail = null;
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        detail = parsed && parsed.detail;
        // FastAPI sends a list of error objects for 422s.
        if (detail && typeof detail !== "string") detail = JSON.stringify(detail);
      } catch (_) { /* not JSON — fall through to the edge/opaque cases */ }
    }
    if (detail) return `${file.name} — upload failed (${r.status}): ${detail}`;
    if (r.status === 413) {
      return `${file.name} — upload failed (413): rejected before it reached Audrey. `
           + `The request body exceeded a proxy/CDN limit that sits in front of the app, `
           + `not Audrey's own ${limits ? fmtBytes(limits.max_upload_bytes) : ""} cap.`;
    }
    const snippet = raw.trim().replace(/\s+/g, " ").slice(0, 200);
    return `${file.name} — upload failed (${r.status})`
         + (snippet ? `: ${snippet}` : " with an empty response body.");
  }

  drop.addEventListener("click", () => picker.click());
  picker.addEventListener("change", (e) => handleFiles(e.target.files));
  drop.addEventListener("dragover", (e) => {
    e.preventDefault(); drop.classList.add("hover");
  });
  drop.addEventListener("dragleave", () => drop.classList.remove("hover"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault(); drop.classList.remove("hover");
    handleFiles(e.dataTransfer.files);
  });

  async function handleFiles(files) {
    const batch = Array.from(files);
    if (!batch.length) return;
    clearLog();

    // The pre-check needs the limits and the current quota usage. On a cold
    // page that hasn't finished its first list call, wait for one.
    if (!limits) await refreshList();

    let pending = 0;
    let uploaded = 0;
    for (const file of batch) {
      const problem = precheckFailure(file, pending);
      if (problem) {
        logLine(`Skipped ${file.name} (${fmtBytes(file.size)}) — ${problem}.`, "err");
        continue;
      }
      pending += file.size;
      if (await uploadOne(file)) uploaded += 1;
    }

    // Re-picking the same file after fixing it fires no `change` event unless
    // the input is cleared first, which makes a rejection look like a hang.
    picker.value = "";
    if (uploaded) await refreshList();
  }

  async function uploadOne(file) {
    const line = logLine(`Uploading ${file.name} (${fmtBytes(file.size)})…`);
    try {
      // Anything a single request body can still carry goes the simple way.
      // Above that the edge proxy would refuse the body outright, so the
      // file has to travel as parts.
      const chunked = limits && file.size > limits.max_upload_bytes;
      const r = chunked ? await sendChunked(file, line) : await sendSingle(file);
      clearBar(line);
      if (!r.ok) {
        setLine(line, await describeFailure(r, file), "err");
        return false;
      }
      const body = await r.json();
      setLine(line, body.status === "pending"
        // Say plainly that it is stored but not yet searchable. Reporting
        // "0 chunks" as a success would read as a silent failure.
        ? `Stored ${body.filename} — awaiting processing, not searchable yet.`
        : `Uploaded ${body.filename} → ${body.chunks} chunk${body.chunks === 1 ? "" : "s"}.`,
        "ok");
      return true;
    } catch (e) {
      if (String(e.message) === "unauthorized") return false;
      clearBar(line);
      // fetch() rejects rather than resolving when the transport itself
      // fails, so there is no status to report — a connection reset partway
      // through a large body is the usual cause.
      setLine(line, `${file.name} — upload failed: connection error (${e}).`, "err");
      return false;
    }
  }

  function sendSingle(file) {
    const fd = new FormData();
    fd.append("file", file);
    return authedFetch(`/v1/files`, { method: "POST", body: fd });
  }

  /** Slice the file and send it part by part, then ask the server to assemble.
   *
   * Returns the /complete response, so the caller handles success and failure
   * identically for both transports. A non-ok response from any earlier step
   * is returned as-is for `describeFailure` to explain.
   */
  async function sendChunked(file, line) {
    const open = await authedFetch(`/v1/files/upload-sessions`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ filename: file.name, total_bytes: file.size }),
    });
    if (!open.ok) return open;
    const { upload_id, part_size, parts_total } = await open.json();
    const setProgress = attachBar(line);

    for (let n = 0; n < parts_total; n++) {
      const slice = file.slice(n * part_size, (n + 1) * part_size);
      const put = await authedFetch(
        `/v1/files/upload-sessions/${encodeURIComponent(upload_id)}/parts/${n}`,
        { method: "PUT", body: slice },
      );
      if (!put.ok) return put;
      const done = n + 1;
      setProgress(done, parts_total);
      const pct = Math.round((done / parts_total) * 100);
      setLine(line,
        `Uploading ${file.name} (${fmtBytes(file.size)}) — ${pct}% `
        + `(part ${done}/${parts_total})…`);
    }

    // The bar stays full through assembly: the bytes are all across, and the
    // server-side concatenation has no progress to report.
    setLine(line, `Processing ${file.name}…`);
    return authedFetch(
      `/v1/files/upload-sessions/${encodeURIComponent(upload_id)}/complete`,
      { method: "POST" },
    );
  }

  // Phase 41. Submitting a link is not an upload: nothing crosses the wire but
  // the URL, and the server answers before a byte of video has been fetched. So
  // there is no progress to report here and no pre-check to run — the gates
  // (host allowlist, duplicate, quota) are all server-side, and the answer to
  // every one of them is a `detail` worth showing verbatim.
  async function fetchUrl() {
    const url = urlInput.value.trim();
    if (!url) return;
    clearLog();
    const line = logLine(`Queueing ${url}…`);
    fetchBtn.disabled = true;
    try {
      const r = await authedFetch(`/v1/files/from-url`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      if (!r.ok) {
        let detail = null;
        try {
          const parsed = JSON.parse(await r.text());
          detail = parsed && parsed.detail;
          if (detail && typeof detail !== "string") detail = JSON.stringify(detail);
        } catch (_) { /* not JSON — fall through */ }
        setLine(line, detail
          ? `Not queued (${r.status}): ${detail}`
          : `Not queued (${r.status}).`, "err");
        return;
      }
      // Deliberately does NOT say "downloading". The row is queued for a
      // fetcher that may be busy, and the list below distinguishes waiting
      // from downloading — saying the stronger thing here would contradict it.
      setLine(line, `Queued — the server will fetch it. Watch the row below.`, "ok");
      urlInput.value = "";
      await refreshList();
    } catch (e) {
      if (String(e.message) === "unauthorized") return;
      setLine(line, `Not queued: connection error (${e}).`, "err");
    } finally {
      // Not an unconditional re-enable: the refresh above may have just
      // learned that no hosts are configured, and turning the button back on
      // would offer a control whose every use is refused.
      fetchBtn.disabled = Boolean(limits && limits.fetch_hosts
                                  && limits.fetch_hosts.length === 0);
    }
  }

  fetchBtn.addEventListener("click", fetchUrl);
  urlInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); fetchUrl(); }
  });

  async function deleteOne(fileId) {
    if (!confirm(`Delete ${fileId}? This removes all chunks.`)) return;
    clearLog();
    try {
      const r = await authedFetch(`/v1/files/${encodeURIComponent(fileId)}`, { method: "DELETE" });
      if (!r.ok) {
        logLine(`Delete failed (${r.status}).`, "err");
      } else {
        logLine(`Deleted.`, "ok");
      }
      await refreshList();
    } catch (e) {
      if (String(e.message) === "unauthorized") return;
      logLine(`Delete failed: ${e}`, "err");
    }
  }

  // Poll only while something is actually moving. A row goes
  // pending → processing → ready without the page hearing about it, and the
  // list otherwise refreshes only when you act on it — so a 458-second ingest
  // is indistinguishable from a stalled one until you reload by hand.
  //
  // Deliberately NOT a progress protocol. Reporting stage transitions would
  // mean the worker posting over HTTP, a sibling of `ingest_result`, and lease
  // logic that tolerates partial updates — a lot of surface for "whisper is
  // done, frames are next". Elapsed time against a known typical duration
  // answers the question a user actually has, which is whether to wait.
  const WATCH_INTERVAL_MS = 5000;
  let watchTimer = null;

  // Phase 41's two fetch states join the set for the same reason the other two
  // are in it: they are states a row leaves on its own, with no user action, so
  // a page that does not poll shows a stale row indefinitely. A download is
  // also the longest any of them lasts.
  const MOVING = ["fetch_pending", "fetching", "pending", "processing"];

  function scheduleWatch(files) {
    const moving = files.some(f => MOVING.includes(f.status));
    if (moving) {
      if (watchTimer === null) watchTimer = setInterval(watchTick, WATCH_INTERVAL_MS);
    } else if (watchTimer !== null) {
      clearInterval(watchTimer);
      watchTimer = null;
    }
  }

  function watchTick() {
    // A hidden tab is nobody watching. Browsers throttle background timers
    // anyway, so the poll would land late and irregularly; skipping it means
    // a tab left open overnight costs the server nothing, and the
    // visibilitychange handler catches up the moment it is looked at again.
    if (document.visibilityState === "visible") refreshList();
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && watchTimer !== null) refreshList();
  });

  // Single-flight. On a slow link the 5s timer would otherwise stack requests
  // that each redraw the table underneath the last. Returning the in-flight
  // promise rather than bailing keeps `await refreshList()` in handleFiles
  // meaning what it says — it must not resolve before `limits` is populated.
  let refreshInFlight = null;

  function refreshList() {
    if (refreshInFlight) return refreshInFlight;
    refreshInFlight = fetchList().finally(() => { refreshInFlight = null; });
    return refreshInFlight;
  }

  async function fetchList() {
    try {
      const r = await authedFetch(`/v1/files`);
      if (!r.ok) {
        rows.innerHTML = `<tr><td colspan="6">Error: ${r.status}</td></tr>`;
        return;
      }
      const body = await r.json();
      if (body.server_time) {
        const serverNow = Date.parse(body.server_time);
        if (!Number.isNaN(serverNow)) serverSkewMs = Date.now() - serverNow;
      }
      who.textContent = body.user;
      storedBytes = body.total_bytes;
      scheduleWatch(body.files);
      if (body.limits) applyLimits(body.limits);
      quota.textContent =
        `Stored: ${fmtBytes(body.total_bytes)}`
        + (limits ? ` of ${fmtBytes(limits.max_user_bytes)}` : "")
        + ` across ${body.files.length} file${body.files.length === 1 ? "" : "s"}.`;
      if (body.files.length === 0) {
        rows.innerHTML = `<tr><td colspan="6" style="color: var(--muted);">No files yet.</td></tr>`;
        return;
      }
      rows.innerHTML = body.files.map(f => `
        <tr class="${rowClass(f)}">
          <td>${nameCell(f)}</td>
          <td>${escapeHtml(f.mime)}</td>
          <td class="right">${sizeCell(f)}</td>
          <td class="right">${f.status === "ready" ? f.chunks : "—"}</td>
          <td>${statusCell(f)}</td>
          <td><button class="danger" data-id="${escapeAttr(f.file_id)}">delete</button></td>
        </tr>
        ${summaryRow(f)}
      `).join("");
      rows.querySelectorAll("button.danger").forEach(btn =>
        btn.addEventListener("click", () => deleteOne(btn.dataset.id)),
      );
      // Remember what is open, so the next poll's rebuild reopens it. The
      // `toggle` event fires for both directions, which is why this is one
      // listener rather than a click handler that has to guess the new state.
      rows.querySelectorAll("details.vsum").forEach(d =>
        d.addEventListener("toggle", () => {
          if (d.open) expanded.add(d.dataset.id);
          else expanded.delete(d.dataset.id);
        }),
      );
    } catch (e) {
      if (String(e.message) === "unauthorized") return;
      rows.innerHTML = `<tr><td colspan="6">Error: ${e}</td></tr>`;
    }
  }

  // A row that stops moving has to say so. 'pending' and 'processing' both
  // mean not-yet-searchable; 'failed' means it never will be without another
  // upload, and the reason is the only thing that makes that actionable.
  function rowClass(f) {
    if (f.status === "failed") return "err";
    return f.status === "ready" ? "" : "pending";
  }

  // Which summaries the user has opened, by file_id.
  //
  // The table is rebuilt from scratch on every poll, so `<details open>` lives
  // in the DOM only until the next refresh — five seconds, any time something
  // else on the page is still processing. Without this, expanding one video's
  // summary while another is being ingested snaps shut under your cursor.
  const expanded = new Set();

  // Phase 37. A second row under the file, because "jasonRetirement.mp4 ·
  // 288 MB · ready" tells you nothing you did not already know. Absent for
  // everything that is not a processed video, and absent for a video whose
  // summary call failed — that is a missing field, not an error to surface.
  //
  // Collapsed by default since 2026-08-06, showing one line. The paragraph is
  // worth having and worth not reading twenty times: what a file list is for
  // is finding a file, and a wall of prose between every row makes that
  // harder. A bare "Summary" toggle would have been simpler and worse — it
  // hides the one thing that distinguishes two videos with unhelpful
  // filenames, which is the case the summary exists for.
  function summaryRow(f) {
    if (!f.summary) return "";
    const open = expanded.has(f.file_id) ? " open" : "";
    return `
      <tr class="summary">
        <td colspan="6">
          <details class="vsum"${open} data-id="${escapeAttr(f.file_id)}">
            <summary
              ><span class="teaser">${escapeHtml(teaserOf(f.summary))}</span
              ><span class="label">Summary</span></summary>
            <div class="prose">${escapeHtml(f.summary)}</div>
          </details>
        </td>
      </tr>`;
  }

  /** The first line's worth of a summary, for the collapsed state. */
  function teaserOf(text) {
    const flat = String(text).replace(/\s+/g, " ").trim();
    return flat.length > 100 ? flat.slice(0, 99).trimEnd() + "…" : flat;
  }

  // Phase 41. Two labels, both answering a question you only ask when
  // something looks wrong.
  //
  // The LINK is the important one while a fetch is in flight: the filename is
  // a placeholder until yt-dlp reports the real title, so "is it fetching the
  // video I meant?" is answerable from the link and from nothing else.
  //
  // The TRANSCRIPT SOURCE matters afterwards. Auto-captions mishear names and
  // drop punctuation, whisper invents text over music, human subtitles are
  // usually right — so "the transcript is wrong" has three different answers
  // and this is the only thing that says which one applies.
  const SOURCE_LABELS = {
    subtitles: "subtitles",
    auto_captions: "auto-captions",
    whisper: "whisper",
  };

  function nameCell(f) {
    let out = escapeHtml(f.filename);
    if (f.source_url) {
      out += ` <a class="src" href="${escapeAttr(f.source_url)}"`
           + ` target="_blank" rel="noopener noreferrer"`
           + ` title="${escapeAttr(f.source_url)}">↗</a>`;
    }
    const label = SOURCE_LABELS[f.transcript_source];
    if (label) {
      out += `<span class="tag" title="What produced this transcript.">${label}</span>`;
    }
    return out;
  }

  // Phase 38. A reclaimed video still reports the size it was uploaded at —
  // that is the honest record, and the quota is what changed, not the file.
  // Without saying so here the two numbers simply disagree: 288 MB in the
  // list, nothing against the allowance, and no way to tell that from a bug.
  function sizeCell(f) {
    // A row that has not been downloaded yet genuinely has no size. "0 B" is a
    // measurement, and printing one for a number nobody has taken yet is the
    // kind of small lie that gets read as a failed download.
    if (!f.bytes && (f.status === "fetch_pending" || f.status === "fetching")) return "—";
    const size = fmtBytes(f.bytes);
    if (!f.source_freed_at) return size;
    return `<span title="Source reclaimed ${escapeAttr(f.source_freed_at)} —`
      + ` the video is still searchable, but cannot be re-processed."`
      + ` style="text-decoration: line-through; color: var(--muted);"`
      + `>${size}</span>`;
  }

  // Elapsed is measured against the SERVER's clock, not this browser's.
  //
  // `serverSkewMs` is the gap between the two, measured when a list lands. A
  // laptop that slept through a timezone change, or is simply minutes out,
  // would otherwise render "processing for 47 hours" or a negative — both of
  // which read as a broken job queue rather than a wrong clock, and send
  // someone to debug the worker. Null until a response carries `server_time`.
  let serverSkewMs = null;

  function fmtElapsed(seconds) {
    const s = Math.max(0, Math.round(seconds));
    if (s < 60) return `${s}s`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ${String(s % 60).padStart(2, "0")}s`;
    return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
  }

  /** Seconds since `stamp` on the server's clock, or null if unreadable.
   *
   * A row cannot have started in the future, so a negative means the clocks
   * disagree by more than the skew correction covers; fmtElapsed clamps it to
   * 0, which is the honest degradation.
   */
  function elapsedSince(stamp) {
    if (!stamp) return null;
    const started = Date.parse(stamp);
    if (Number.isNaN(started)) return null;
    return (Date.now() - (serverSkewMs || 0) - started) / 1000;
  }

  /** What a download in flight says about itself.
   *
   * Three tiers, and which one you get depends entirely on what is actually
   * known — none of them guesses:
   *
   *   1. Both numbers → `42% — 121.4 MB of 288.3 MB`. The percentage answers
   *      "how much longer", the byte figures make it checkable, and seeing the
   *      total change is how a two-stream download explains itself.
   *   2. Bytes but no total → `121.4 MB downloaded`. Some sites will not
   *      commit to a size. A percentage of an unknown total would be an
   *      invention, and this is the one number that is still true.
   *   3. Neither → elapsed time, which is where this started. The metadata
   *      pass runs before any byte moves, so every download spends its first
   *      seconds here.
   */
  /** How far the download has got — `42% (10/82 MB)` — or null if nothing is known.
   *
   * Returns the detail only, never a whole label, because the caller decides
   * whether a download is worth naming at all.
   */
  function fetchProgress(f) {
    const done = f.fetch_downloaded_bytes || 0;
    const total = f.fetch_total_bytes || 0;
    // `total` alone, NOT `done && total`.
    //
    // The first update carries `downloaded_bytes: 0` with a real size
    // estimate, and it is sent before the download starts — so on a fast fetch
    // it can be the only update the page ever sees. Requiring `done` to be
    // truthy discarded exactly that one and fell through to elapsed seconds,
    // which is why a working progress channel could still show no bytes at
    // all. `0/82 MB` is the honest reading of a download about to begin.
    if (total) {
      // Clamped because that first figure is an *estimate* and can undershoot.
      // Exact numbers replace it within a couple of seconds; showing 118% in
      // the meantime would look like a bug in something.
      const pct = Math.min(100, Math.round((done / total) * 100));
      return `${pct}% (${fmtPair(done, total)})`;
    }
    if (done) return `${fmtBytes(done)} so far`;
    return null;
  }

  /** Two byte counts sharing one unit: `10/82 MB`.
   *
   * The unit comes from the total, not from each number independently.
   * `fmtBytes` applied twice gives "980 KB of 1.2 GB", which makes you do
   * arithmetic to work out that it has barely started — the whole point of
   * showing both is that the ratio should be readable at a glance.
   */
  function fmtPair(done, total) {
    const units = [["GB", 1024 ** 3], ["MB", 1024 ** 2], ["KB", 1024]];
    for (const [name, size] of units) {
      if (total >= size) {
        const d = done / size;
        // One decimal below 10 so a download that has just started reads
        // `0.4/82 MB` rather than rounding to a flat `0`.
        return `${d < 10 ? d.toFixed(1) : Math.round(d)}/${Math.round(total / size)} ${name}`;
      }
    }
    return `${done}/${total} B`;
  }

  /** Two labels for the whole in-flight span: downloading, then summarizing.
   *
   * The row used to walk four — queued to download, downloading, queued,
   * summarizing. At 480p the download is about a second, shorter than
   * `WATCH_INTERVAL_MS`, so the queue states flickered past unread. Four names
   * for one wait is not more information than two; it is the same information
   * plus churn.
   *
   * The pairs that merged are the ones a user cannot act on differently:
   * `fetch_pending` and `fetching` are both "getting the video", `pending` and
   * `processing` are both "working on it". Which side of a handover a row sits
   * on is a fact about the queue, not about the video.
   *
   * "summarizing" rather than "processing" because that is what the wait is
   * made of: describing keyframes and writing the summary are model calls, and
   * they are nearly all of the time. Only the label changes — `processing` is
   * the state the worker claims on and the row stores, and renaming that would
   * be a protocol change for a word.
   *
   * Elapsed runs from `uploaded_at` throughout rather than from whichever state
   * the row is in, so the number climbs continuously instead of resetting to
   * zero at each handover. It is what makes the label useful at all: a
   * nine-minute video takes ~458s, so a bare "summarizing…" gives no way to
   * tell a job that is working from one that has hung.
   */
  function statusCell(f) {
    if (f.status === "ready") return escapeHtml(f.uploaded_at);
    if (f.status === "failed") {
      return f.failure_reason
        ? `failed — ${escapeHtml(f.failure_reason)}`
        : "failed";
    }
    const secs = elapsedSince(f.uploaded_at);
    const elapsed = secs === null ? "" : ` — ${fmtElapsed(secs)}`;
    if (f.status === "fetch_pending" || f.status === "fetching") {
      // Progress replaces elapsed rather than joining it. On a long download
      // "42% (10/82 MB)" answers everything elapsed time was standing in for,
      // and appending both gives a label with two dashes in it.
      const detail = fetchProgress(f);
      return detail ? `downloading — ${detail}` : `downloading${elapsed}`;
    }
    return secs === null ? "summarizing…" : `summarizing${elapsed}`;
  }

  // Server-published limits drive the copy too, so the page can't advertise
  // a cap that config.yaml no longer sets.
  function applyLimits(next) {
    limits = next;
    const ceiling = limits.chunked_max_bytes || limits.max_upload_bytes;
    hint.textContent =
      `Max ${fmtBytes(ceiling)} per file · `
      + `${fmtBytes(limits.max_user_bytes)} total per user. `
      + `Files over ${fmtBytes(limits.max_upload_bytes)} upload in parts.`;
    supported.textContent =
      `Supported: ${limits.allowed_extensions.join(", ")}. `
      + `Video is stored but not searchable until processing lands.`;
    if (limits.fetch_hosts) {
      // Named rather than described. "Supported sites" invites a paste of
      // something that is not one, and the refusal then arrives after the
      // click instead of before it. An empty list is the configured refuse-all
      // default, and saying so is better than an input that always fails.
      urlInput.placeholder = limits.fetch_hosts.length
        ? `Paste a link from ${limits.fetch_hosts.join(", ")}`
        : `Link fetching is not enabled on this server`;
      urlInput.disabled = fetchBtn.disabled = limits.fetch_hosts.length === 0;
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  refreshList();
})();
</script>
</body>
</html>
