<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Audrey — Knowledge Upload</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f1115;
      --panel: #181b22;
      --panel2: #1f232c;
      --text: #e6e8ec;
      --muted: #8b95a6;
      --accent: #7aa7ff;
      --danger: #ff6b6b;
      --ok: #6fd18d;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 32px;
      max-width: 960px; margin-inline: auto;
    }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    .who { font-size: 0.85rem; color: var(--muted); margin: 0 0 20px; }
    .who strong { color: var(--text); }
    #drop {
      border: 2px dashed var(--border); border-radius: 12px;
      padding: 48px; text-align: center; background: var(--panel);
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    #drop.hover { border-color: var(--accent); background: var(--panel2); }
    #drop p { margin: 0; color: var(--muted); }
    #drop strong { color: var(--text); }
    #picker { display: none; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }

    table { width: 100%; border-collapse: collapse; margin-top: 24px; }
    th, td {
      text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { color: var(--muted); font-weight: 500; }
    tr.pending td { color: var(--muted); }
    tr.err td { color: var(--danger); }
    td.right { text-align: right; }

    button {
      background: var(--panel2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 0.85rem;
    }
    button.danger { border-color: var(--danger); color: var(--danger); }
    button:hover { background: var(--panel); }

    #status { margin-top: 12px; font-size: 0.85rem; }
    #status div { margin-top: 4px; }
    #status div.ok { color: var(--ok); }
    #status div.err { color: var(--danger); }

    .quota { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Audrey · Knowledge Upload</h1>
  <p class="sub">
    Upload files into your private knowledge collection.
    <span id="supported">Loading supported formats…</span>
  </p>

  <p class="who">Signed in as <strong id="who">…</strong> · <a href="/" id="signout">sign out</a></p>

  <div id="drop">
    <p><strong>Drop files here</strong> or click to select.</p>
    <p class="hint" id="hint">Max 50 MB per file. Quota per user applies.</p>
    <input id="picker" type="file" multiple />
  </div>

  <div id="status"></div>

  <h2 style="margin-top: 32px; font-size: 1.1rem;">Your files</h2>
  <div class="quota" id="quota"></div>
  <table>
    <thead>
      <tr>
        <th>Filename</th><th>Mime</th><th class="right">Size</th>
        <th class="right">Chunks</th><th>Uploaded</th><th></th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="6" style="color: var(--muted);">—</td></tr></tbody>
  </table>

<script>
(() => {
  // OWUI stores its JWT here after login. Same-origin via cloudflared is
  // what lets this page read localStorage — that's why /upload is served
  // from the audrey domain rather than as a separate origin.
  const token = localStorage.getItem("token");
  if (!token) {
    window.location.href = "/";
    return;
  }

  const drop = document.getElementById("drop");
  const picker = document.getElementById("picker");
  const status = document.getElementById("status");
  const rows = document.getElementById("rows");
  const quota = document.getElementById("quota");
  const who = document.getElementById("who");
  const signout = document.getElementById("signout");
  const hint = document.getElementById("hint");
  const supported = document.getElementById("supported");

  // Populated by refreshList() from GET /v1/files. Null until that lands,
  // in which case the pre-check fails OPEN and defers to the server — a
  // client that can't see the limits must never be the reason an upload
  // is refused.
  let limits = null;
  let storedBytes = 0;

  signout.addEventListener("click", (e) => {
    e.preventDefault();
    localStorage.removeItem("token");
    window.location.href = "/";
  });

  async function authedFetch(url, opts = {}) {
    const headers = new Headers(opts.headers || {});
    headers.set("Authorization", `Bearer ${token}`);
    const r = await fetch(url, { ...opts, headers });
    if (r.status === 401) {
      localStorage.removeItem("token");
      window.location.href = "/";
      throw new Error("unauthorized");
    }
    return r;
  }

  function fmtBytes(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    if (n < 1024 * 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + " MB";
    return (n / (1024 * 1024 * 1024)).toFixed(2) + " GB";
  }

  function clearLog() { status.replaceChildren(); }

  // One line per file. Returns the node so uploadOne can rewrite "Uploading…"
  // into the outcome in place rather than stacking two lines per file.
  function logLine(msg, cls) {
    const line = document.createElement("div");
    line.textContent = msg;
    if (cls) line.className = cls;
    status.appendChild(line);
    return line;
  }

  function extOf(name) {
    const i = name.lastIndexOf(".");
    return i > 0 ? name.slice(i).toLowerCase() : "";
  }

  /** Reason this file can't be accepted, or null to go ahead.
   *
   * `pending` is the total already committed by earlier files in the same
   * batch — without it, dropping ten files that each individually fit under
   * the remaining quota would pass ten pre-checks and then fail server-side.
   */
  function precheckFailure(file, pending) {
    if (!limits) return null;
    if (file.size === 0) return "the file is empty";
    if (file.size > limits.max_upload_bytes) {
      return `${fmtBytes(file.size)} is over the ${fmtBytes(limits.max_upload_bytes)} per-file limit`;
    }
    const ext = extOf(file.name);
    if (!ext) return `no file extension — supported: ${limits.allowed_extensions.join(", ")}`;
    if (!limits.allowed_extensions.includes(ext)) {
      return `${ext} is not a supported format — supported: ${limits.allowed_extensions.join(", ")}`;
    }
    const free = limits.max_user_bytes - storedBytes - pending;
    if (file.size > free) {
      return `not enough quota — needs ${fmtBytes(file.size)}, ${fmtBytes(Math.max(0, free))} free `
           + `of ${fmtBytes(limits.max_user_bytes)}`;
    }
    return null;
  }

  /** Turn a failed response into something that names the actual cause.
   *
   * Audrey's own rejections are JSON with a `detail`. Anything else means the
   * response was written by something in front of Audrey — cloudflared or the
   * CDN edge — which is worth saying out loud, because the fix lives in a
   * different place than a limit the app controls.
   */
  async function describeFailure(r, file) {
    const raw = await r.text().catch(() => "");
    let detail = null;
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        detail = parsed && parsed.detail;
        // FastAPI sends a list of error objects for 422s.
        if (detail && typeof detail !== "string") detail = JSON.stringify(detail);
      } catch (_) { /* not JSON — fall through to the edge/opaque cases */ }
    }
    if (detail) return `${file.name} — upload failed (${r.status}): ${detail}`;
    if (r.status === 413) {
      return `${file.name} — upload failed (413): rejected before it reached Audrey. `
           + `The request body exceeded a proxy/CDN limit that sits in front of the app, `
           + `not Audrey's own ${limits ? fmtBytes(limits.max_upload_bytes) : ""} cap.`;
    }
    const snippet = raw.trim().replace(/\s+/g, " ").slice(0, 200);
    return `${file.name} — upload failed (${r.status})`
         + (snippet ? `: ${snippet}` : " with an empty response body.");
  }

  drop.addEventListener("click", () => picker.click());
  picker.addEventListener("change", (e) => handleFiles(e.target.files));
  drop.addEventListener("dragover", (e) => {
    e.preventDefault(); drop.classList.add("hover");
  });
  drop.addEventListener("dragleave", () => drop.classList.remove("hover"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault(); drop.classList.remove("hover");
    handleFiles(e.dataTransfer.files);
  });

  async function handleFiles(files) {
    const batch = Array.from(files);
    if (!batch.length) return;
    clearLog();

    // The pre-check needs the limits and the current quota usage. On a cold
    // page that hasn't finished its first list call, wait for one.
    if (!limits) await refreshList();

    let pending = 0;
    let uploaded = 0;
    for (const file of batch) {
      const problem = precheckFailure(file, pending);
      if (problem) {
        logLine(`Skipped ${file.name} (${fmtBytes(file.size)}) — ${problem}.`, "err");
        continue;
      }
      pending += file.size;
      if (await uploadOne(file)) uploaded += 1;
    }

    // Re-picking the same file after fixing it fires no `change` event unless
    // the input is cleared first, which makes a rejection look like a hang.
    picker.value = "";
    if (uploaded) await refreshList();
  }

  async function uploadOne(file) {
    const line = logLine(`Uploading ${file.name} (${fmtBytes(file.size)})…`);
    const fd = new FormData();
    fd.append("file", file);
    try {
      const r = await authedFetch(`/v1/files`, { method: "POST", body: fd });
      if (!r.ok) {
        line.textContent = await describeFailure(r, file);
        line.className = "err";
        return false;
      }
      const body = await r.json();
      line.textContent = `Uploaded ${body.filename} → ${body.chunks} chunk${body.chunks === 1 ? "" : "s"}.`;
      line.className = "ok";
      return true;
    } catch (e) {
      if (String(e.message) === "unauthorized") return false;
      // fetch() rejects rather than resolving when the transport itself
      // fails, so there is no status to report — a connection reset partway
      // through a large body is the usual cause.
      line.textContent = `${file.name} — upload failed: connection error (${e}).`;
      line.className = "err";
      return false;
    }
  }

  async function deleteOne(fileId) {
    if (!confirm(`Delete ${fileId}? This removes all chunks.`)) return;
    clearLog();
    try {
      const r = await authedFetch(`/v1/files/${encodeURIComponent(fileId)}`, { method: "DELETE" });
      if (!r.ok) {
        logLine(`Delete failed (${r.status}).`, "err");
      } else {
        logLine(`Deleted.`, "ok");
      }
      await refreshList();
    } catch (e) {
      if (String(e.message) === "unauthorized") return;
      logLine(`Delete failed: ${e}`, "err");
    }
  }

  async function refreshList() {
    try {
      const r = await authedFetch(`/v1/files`);
      if (!r.ok) {
        rows.innerHTML = `<tr><td colspan="6">Error: ${r.status}</td></tr>`;
        return;
      }
      const body = await r.json();
      who.textContent = body.user;
      storedBytes = body.total_bytes;
      if (body.limits) applyLimits(body.limits);
      quota.textContent =
        `Stored: ${fmtBytes(body.total_bytes)}`
        + (limits ? ` of ${fmtBytes(limits.max_user_bytes)}` : "")
        + ` across ${body.files.length} file${body.files.length === 1 ? "" : "s"}.`;
      if (body.files.length === 0) {
        rows.innerHTML = `<tr><td colspan="6" style="color: var(--muted);">No files yet.</td></tr>`;
        return;
      }
      rows.innerHTML = body.files.map(f => `
        <tr>
          <td>${escapeHtml(f.filename)}</td>
          <td>${escapeHtml(f.mime)}</td>
          <td class="right">${fmtBytes(f.bytes)}</td>
          <td class="right">${f.chunks}</td>
          <td>${escapeHtml(f.uploaded_at)}</td>
          <td><button class="danger" data-id="${escapeAttr(f.file_id)}">delete</button></td>
        </tr>
      `).join("");
      rows.querySelectorAll("button.danger").forEach(btn =>
        btn.addEventListener("click", () => deleteOne(btn.dataset.id)),
      );
    } catch (e) {
      if (String(e.message) === "unauthorized") return;
      rows.innerHTML = `<tr><td colspan="6">Error: ${e}</td></tr>`;
    }
  }

  // Server-published limits drive the copy too, so the page can't advertise
  // a cap that config.yaml no longer sets.
  function applyLimits(next) {
    limits = next;
    hint.textContent =
      `Max ${fmtBytes(limits.max_upload_bytes)} per file · `
      + `${fmtBytes(limits.max_user_bytes)} total per user.`;
    supported.textContent = `Supported: ${limits.allowed_extensions.join(", ")}.`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  refreshList();
})();
</script>
</body>
</html>
