[project]
name = "audrey"
version = "7.0.0"
description = "Audrey AI — self-hosted multi-model LangGraph orchestrator with OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bart" }]
license = { text = "Proprietary" }

dependencies = [
    # Web framework + server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",

    # HTTP client (streaming, async)
    "httpx>=0.28",

    # Orchestration
    "langgraph>=0.2.60",
    "langchain-core>=0.3.28",

    # Config + validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",

    # Resilience
    "tenacity>=9.0",

    # Tokenization (complexity gate, context compression)
    "tiktoken>=0.8",

    # Vector DB
    "qdrant-client>=1.12",

    # Image embeddings (CLIP only; text embeddings go through Ollama)
    "sentence-transformers>=3.3",
    "pillow>=11.0",

    # Document extraction for KB ingest
    "pypdf>=5.1",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "markdown>=3.7",

    # Mime sniffing for per-user uploads (requires libmagic1 in the image)
    "python-magic>=0.4.27",

    # Filesystem watcher for KB auto-ingest
    "watchdog>=6.0",

    # Local persistence (tool-server memory + health cache)
    "aiosqlite>=0.20",

    # Misc
    "python-dotenv>=1.0",

    # Telemetry (Phase 17 — /metrics endpoint, Prometheus text format)
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    # tools-server-only runtime dep (web_fetch HTML extraction). Listed here so
    # the hermetic suite can import tools-server/fetch.py; NOT a root runtime dep,
    # so the audrey-ai image never ships it. custom-tools gets it for real from
    # tools-server/pyproject.toml.
    "trafilatura>=1.12",
]

[project.scripts]
audrey = "audrey.main:run"
audrey-ingest = "audrey.kb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audrey"]

[tool.uv]
package = true

# Workspace: tools-server lives in its own subdirectory but shares a
# single resolution + lockfile with the root project. Phase 5 (2026-05-12)
# consolidated tools-server/uv.lock into the root uv.lock so deps for both
# services pin together. To add a new tools-server dep: edit
# tools-server/pyproject.toml, then run `uv lock` from the repo root.
[tool.uv.workspace]
members = ["tools-server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "BLE", "ASYNC", "S", "PTH", "RUF"]
ignore = [
    "S101",   # use of assert — fine in tests + defensive code
    "S603",   # subprocess call — only used in audited contexts
    "S607",   # partial executable path — fine for known-binary subprocess
    "E501",   # line too long — we have many intentional long URLs/docstrings
    "B008",   # function call in default arg — REQUIRED by FastAPI Depends idiom
    "RUF001", # ambiguous unicode in string  — intentional UX copy (×, –, etc.)
    "RUF002", # ambiguous unicode in docstring — same
    "RUF003", # ambiguous unicode in comment  — same
    "RUF022", # __all__ not sorted — codebase convention is human-meaningful order
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
