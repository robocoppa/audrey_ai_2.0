###
# Prometheus + Grafana stack for Audrey (Phase 24, moved into the repo).
#
# Run from this directory:
#   cd /mnt/user/appdata/audrey_ai_2.0/monitoring
#   docker compose up -d
#
# Persistent state (TSDB, Grafana SQLite + dashboards) lives OUTSIDE the
# repo at the existing Unraid paths — see absolute bind-mount paths
# below. The repo only owns the configuration (compose, scrape config,
# alert rules).
#
# Joins the existing `ollama-net` network so prometheus can resolve
# `audrey-ai:8000` for scrapes.
###

services:
  prometheus:
    # Phase 31: pinned to digest. Tag (`prom/prometheus:latest`) is what
    # this digest pointed to on 2026-05-02. To bump:
    #   docker pull prom/prometheus:latest
    #   docker inspect --format='{{index .RepoDigests 0}}' prom/prometheus:latest
    image: prom/prometheus@sha256:e4254400b85610324913f0dc4acf92603d9984e7519414c5a12811aa6146acc3
    container_name: prometheus
    restart: unless-stopped
    networks:
      - ollama-net
    ports:
      - "9090:9090"
    volumes:
      # Configuration — repo-relative, read-only.
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules:/etc/prometheus/rules:ro
      # Persistent TSDB — absolute Unraid path, read-write.
      - /mnt/user/appdata/prometheus/data:/prometheus
    environment:
      TZ: America/Denver
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  grafana:
    # Phase 31: pinned to digest (see prometheus block above for bump procedure).
    image: grafana/grafana@sha256:0f86bada30d65ef9d0183b90c1e2682ac92d53d95da8bed322b984ea78a4a73a
    container_name: grafana
    restart: unless-stopped
    networks:
      - ollama-net
    ports:
      - "3000:3000"
    volumes:
      - /mnt/user/appdata/prometheus/grafana-data:/var/lib/grafana
      # Phase 9 (Campaign 2): provision the Prometheus datasource +
      # dashboard provider from the repo, and ship dashboards as JSON
      # files. `git pull` on Unraid is now enough to deploy a new
      # dashboard or panel; no clicking in the UI.
      # See monitoring/README.md "Provisioning" section.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      TZ: America/Denver
      # Phase 26: must be set in the environment when running `compose up`
      # (e.g. via /mnt/user/appdata/audrey_ai_2.0/monitoring/.env). Compose's
      # `:?` syntax fails the up command if the var is unset, preventing the
      # default-`changeme` footgun. Note: this only takes effect on Grafana's
      # *initial* admin user creation; once the admin password is hashed into
      # /var/lib/grafana/grafana.db, changing this env var alone won't update
      # the live password — use `grafana-cli admin reset-admin-password` from
      # inside the container.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in the environment}

networks:
  ollama-net:
    external: true
