# Audrey AI — runtime config
# Env vars override any value here via ${VAR} interpolation in loader.
# Reloaded at startup only. For live tool re-discovery see POST /v1/tools/rediscover.

version: "7.0.0"

router:
  # ⚠️⚠️ THIS SLOT MUST STAY TINY, AND NOT FOR THE REASON IT LOOKS LIKE.
  # `classify_with_registry` takes NO gate argument and calls Ollama directly on
  # both the graph and streaming paths, so `FairLocalGate` — which serialises
  # deep workers in-process — never sees the router call. Under
  # GPU_CONCURRENCY=1 a large local router does not QUEUE behind the deep
  # worker, it EVICTS it. That rules out the big general model (qwen3.8 is
  # 17 GB) however good it would be at the classification itself.
  # ▶ Before changing this: `scripts/router_probe.py` measures parse rate,
  # accuracy, latency AND the confidence distribution on a candidate.
  # ⚠️ Confidence matters as much as accuracy here — the escalation trigger is
  # `conf < 0.95` STRICTLY, so a router that routes correctly but timidly
  # (0.8) sends nearly every turn into a deep panel at ~3 cloud calls each.
  model: "qwen3:4b"
  timeout_s: 20
  max_failures_before_fallback: 2
  # Skip the router LLM call for short prompts (<= N tokens) that produced no
  # strong keyword signal — they're almost always `general` (the tool-capable
  # fast path), so the round-trip is low-value and, on a busy GPU, the main
  # reason the fast-path Thinking banner lagged. Weak keyword signals are still
  # honored. Set 0 to always call the router. Conservative default.
  skip_llm_under_tokens: 8

# ─── Model registry ────────────────────────────────────────────────────
# Per task type, ranked by priority (higher = preferred when healthy).
# Speed/quality are informational hints used by the planner when building panels.
model_registry:
  code:
    # ⚠️ 2026-08-15: qwen3.8:latest replaced THREE local entries here —
    # qwen3-coder-next:latest (100), qwen2.5-coder:32b (90) and qwen3.6:35b (80).
    # It takes the lead local slot at 100. ⚠️ `speed`/`quality` are inherited
    # from the code specialist it replaced and are UNMEASURED for 3.8 — they are
    # planner hints only, but do not quote them as if they were probed.
    - { name: "qwen3.8:latest",           priority: 100, speed: 60, quality: 95, location: local }
    - { name: "minimax-m3:cloud",         priority:  98, speed: 85, quality: 96, location: cloud }
    - { name: "granite4.1:30b",           priority:  82, speed: 80, quality: 86, location: local }
    - { name: "deepseek-v4-pro:cloud",    priority:  82, speed: 80, quality: 95, location: cloud }
    - { name: "kimi-k2.7-code:cloud",     priority:  92, speed: 90, quality: 94, location: cloud }
    - { name: "glm-5.2:cloud",            priority:  88, speed: 90, quality: 91, location: cloud }
    - { name: "kimi-k2.6:cloud",          priority:  78, speed: 90, quality: 92, location: cloud }
    - { name: "deepseek-v4-flash:cloud",  priority:  72, speed: 92, quality: 90, location: cloud }
    - { name: "deepseek-v3.2:cloud",      priority:  70, speed: 85, quality: 90, location: cloud }
    - { name: "cogito-2.1:671b-cloud",    priority:  65, speed: 80, quality: 93, location: cloud }

  reasoning:
    # Ranked by the quality column, not by locality: the local entry led this
    # pool at 100 despite being the lowest-quality of the top group (93 vs
    # 95/95/94). It stays the highest-priority LOCAL entry, so it is still the
    # first failover when cloud is unhealthy or credits run out.
    # `general` deliberately keeps its local lead — see the cost note there.
    - { name: "deepseek-v4-pro:cloud",    priority: 100, speed: 80, quality: 95, location: cloud }
    - { name: "minimax-m3:cloud",         priority:  98, speed: 85, quality: 95, location: cloud }
    - { name: "kimi-k2.6:cloud",          priority:  96, speed: 90, quality: 94, location: cloud }
    - { name: "qwen3.8:latest",           priority:  94, speed: 70, quality: 93, location: local }
    - { name: "kimi-k2.7-code:cloud",     priority:  88, speed: 90, quality: 93, location: cloud }
    - { name: "deepseek-r1:32b",          priority:  85, speed: 65, quality: 90, location: local }
    - { name: "cogito-2.1:671b-cloud",    priority:  75, speed: 80, quality: 93, location: cloud }
    - { name: "nemotron-3-super:cloud",   priority:  70, speed: 85, quality: 90, location: cloud }

  general:
    - { name: "qwen3.8:latest",           priority: 100, speed: 75, quality: 92, location: local }
    - { name: "deepseek-v4-pro:cloud",    priority:  97, speed: 80, quality: 95, location: cloud }
    - { name: "minimax-m3:cloud",         priority:  96, speed: 85, quality: 95, location: cloud }
    - { name: "kimi-k2.6:cloud",          priority:  95, speed: 90, quality: 93, location: cloud }
    - { name: "kimi-k2.7-code:cloud",     priority:  88, speed: 90, quality: 92, location: cloud }
    - { name: "qwen3.5:397b-cloud",       priority:  90, speed: 80, quality: 94, location: cloud }
    - { name: "deepseek-v4-flash:cloud",  priority:  82, speed: 92, quality: 89, location: cloud }
    - { name: "glm-4.7-flash:q8_0",       priority:  80, speed: 85, quality: 87, location: local }
    - { name: "olmo-3.1:32b",             priority:  70, speed: 75, quality: 85, location: local }
    - { name: "llama4:latest",            priority:  65, speed: 55, quality: 90, location: local }
    - { name: "glm-5.2:cloud",            priority:  62, speed: 90, quality: 88, location: cloud }

  vl:
    # Vision-language pool — image turns on the chat path route here.
    # Local-only on purpose: only genuinely image-capable models belong in
    # this pool, and both locals below are vision models that are pulled on
    # the box. The previous pool led with nemotron3:33b (a text/reasoning
    # model) and listed unverified cloud entries — an image routed there
    # would be answered blind. qwen3-vl is the primary; llava the fallback.
    # nemotron3:33b keeps its reasoning + deep-panel-worker roles elsewhere.
    # (To add a cloud vl model later, confirm it actually accepts images.)
    - { name: "qwen3-vl:32b",             priority: 100, speed: 70, quality: 90, location: local }
    - { name: "llava:34b",                priority:  90, speed: 65, quality: 85, location: local }

# ─── Fast path ─────────────────────────────────────────────────────────
fast_path:
  enabled: true
  confidence_threshold: 0.88

  # Tell fast-path models not to think. This is the user-is-waiting role, and
  # unlike the other thinking decisions it was measured **with tools in the
  # request** — which is the part that matters, because this path's job is tool
  # calling and a prose benchmark would have justified it for the wrong reason.
  #
  # `qwen3.6:35b` (REPLACED by qwen3.8:latest 2026-08-15 — this table is the
  # measurement that justified the line, not a claim about the current model),
  # TOOLS=1, three samples (2026-08-07):
  #
  #     omitted    933c thinking   277 eval tok   right tool 2/3
  #     true      1090c thinking   333 eval tok   right tool 3/3
  #     false         0c            45 eval tok   right tool 3/3
  #
  # **Tool selection did not degrade** — it matched think=true and beat the
  # current default. `omitted` is what this path does today, and it was the
  # only state that ever picked the wrong tool: with reasoning on the model
  # sometimes talked itself into `list_my_files` for a question about a named
  # file's contents. 6x fewer tokens per round, and a ReAct loop pays that per
  # round. Every `false` run was 0.6-0.7s and exactly 45 tokens — the
  # run-to-run variance disappears too.
  #
  # ⚠️ Not a flat flag — sending `think` to a model that does not declare
  # `thinking` is a HARD ERROR. `granite4.1:30b` does not declare it; the two
  # others that did not (`qwen2.5-coder:32b`, `qwen3-coder-next:latest`) were
  # replaced by `qwen3.8:latest` on 2026-08-15 and **whether 3.8 declares
  # `thinking` is UNVERIFIED** (`ollama show qwen3.8:latest`). The code asks
  # Ollama once per model and omits the field for those that do not, so this is
  # safe to leave on while the list changes — that indirection is what makes the
  # unknown tolerable, not knowledge of the answer.
  #
  # ⚠️ Measured on ONE of the fourteen. The role argument does not depend on
  # the model — a waiting user pays for reasoning in latency either way — but
  # if a specific model answers worse, probe it before blaming this line.
  no_thinking: true

  tool_capable_models:
    # ⚠️ One entry where there were three (2026-08-15): qwen3.6:35b,
    # qwen3-coder-next:latest and qwen2.5-coder:32b all became qwen3.8:latest.
    # ✅ `ollama show qwen3.8:latest` declares `tools` (2026-08-15), so its place
    # in this list is verified capability, not assumption. It also declares
    # `thinking` and `vision` — see `vision.also_capable` for the second one.
    - "qwen3.8:latest"
    - "kimi-k2.7-code:cloud"
    - "kimi-k2.6:cloud"
    - "granite4.1:30b"
    - "deepseek-v4-pro:cloud"
    - "deepseek-v4-flash:cloud"
    - "deepseek-v3.2:cloud"
    - "qwen3.5:397b-cloud"
    - "cogito-2.1:671b-cloud"
    - "nemotron-3-super:cloud"
    - "minimax-m3:cloud"
    - "glm-5.2:cloud"

# ─── Deep panel: mixed (audrey_deep) ───────────────────────────────────
# One local + TWO cloud workers per task (text tasks). The local worker holds
# the GPU gate; both cloud workers run concurrently next to it (Ollama Pro caps
# at `agentic.max_deep_workers_cloud`, default 3), so the second cloud draft is
# near-free on wall-clock and gives the synthesizer a third, independent take.
# The two cloud models are deliberately different vendors for draft diversity.
# VRAM on the host fits one local model at a time (GPU_CONCURRENCY=1).
deep_panel:
  code:
    # ⚠️ THREE cloud workers here, not two — `code` is the exception to the
    # header above. `minimax-m3:cloud` was added 2026-08-15: at quality 96 it is
    # the highest-rated entry in `model_registry.code` and was going unused, and
    # it is a fourth vendor (qwen / moonshot / deepseek / minimax), which is the
    # diversity argument this panel is built on.
    # ⚠️⚠️ THIS POOL IS NOW EXACTLY AT `max_deep_workers_cloud` (3, pinned by
    # MAX_DEEP_WORKERS_CLOUD in .env). A FOURTH cloud worker added here would be
    # dropped by `_healthy_workers` with NO log line — dead config that looks
    # live. Raise the cap first, or do not add one.
    # ⚠️ Cost: a code panel is now FOUR cloud calls (3 workers + the cloud
    # synth), up from three. Cloud credits are a hard budget — see
    # `scripts/analyze_escalations.py` for what escalation multiplies that by.
    workers: ["qwen3.8:latest", "kimi-k2.7-code:cloud", "deepseek-v4-pro:cloud",
              "minimax-m3:cloud"]
    # glm-5.2 (cloud) primary synth: skips the local cold-load a LOCAL synth
    # incurs (synth can't co-reside in VRAM with a local worker under
    # GPU_CONCURRENCY=1, so it has to load AFTER the worker unloads). Measured
    # on qwen3.6:35b; the argument is about locality, not the model, so it
    # survives the 2026-08-15 swap. The local model stays as the fallback if
    # the cloud synth call fails.
    synthesizer: "glm-5.2:cloud"
    fallback_synth: "qwen3.8:latest"
  reasoning:
    workers: ["qwen3.8:latest", "kimi-k2.6:cloud", "deepseek-v4-pro:cloud"]
    synthesizer: "glm-5.2:cloud"
    fallback_synth: "qwen3.8:latest"
  general:
    workers: ["qwen3.8:latest", "kimi-k2.6:cloud", "deepseek-v4-pro:cloud"]
    synthesizer: "glm-5.2:cloud"
    fallback_synth: "qwen3.8:latest"
  # vl stays one local + one cloud: the deep path rebuilds prompts text-only,
  # so the cloud workers never see the image — and image turns force the fast
  # path anyway (the local qwen3-vl is the real worker). A second cloud draft
  # here would merge a blind text take, so it isn't worth the call.
  vl:
    workers: ["qwen3-vl:32b", "kimi-k2.6:cloud"]
    synthesizer: "qwen3.8:latest"
    fallback_synth: "glm-5.2:cloud"

# ─── Deep panel: cloud-only (audrey_cloud) ─────────────────────────────
# Both workers run in parallel (Ollama Pro caps at 3 concurrent cloud).
# glm-5.2 leads and synthesizes (2026-07-30). Each task keeps its existing
# second worker for vendor diversity, and deepseek-v4-pro — which held both
# slots before — becomes the degrade target, so a glm outage falls onto a
# different vendor rather than a second glm call.
deep_panel_cloud:
  code:
    workers: ["glm-5.2:cloud", "minimax-m3:cloud"]
    synthesizer: "glm-5.2:cloud"
    fallback_synth: "deepseek-v4-pro:cloud"
  reasoning:
    workers: ["glm-5.2:cloud", "qwen3.5:397b-cloud"]
    synthesizer: "glm-5.2:cloud"
    fallback_synth: "deepseek-v4-pro:cloud"
  general:
    workers: ["glm-5.2:cloud", "qwen3.5:397b-cloud"]
    synthesizer: "glm-5.2:cloud"
    fallback_synth: "deepseek-v4-pro:cloud"
  vl:
    workers: ["glm-5.2:cloud", "qwen3.5:397b-cloud"]
    synthesizer: "glm-5.2:cloud"
    fallback_synth: "deepseek-v4-pro:cloud"

# ─── Deep panel: local-only (audrey_local) ─────────────────────────────
# Both workers serialize through GpuGate (GPU_CONCURRENCY=1) — no parallelism.
# Worker ORDER matters here: the first-listed worker runs first (and loads
# cold first), so it's the de-facto primary. reasoning + general lead with
# deepseek-r1:32b, then the local general model (qwen3.6:35b when this was
# written; qwen3.8:latest since 2026-08-15). (Dropped glm-4.7-flash:q8_0 from general:
# it was hitting the 240s deep_worker ReadTimeout — too slow to cold-load +
# generate when it ran second behind qwen3.6 through the single GPU.)
deep_panel_local:
  code:
    # ⚠️⚠️ DEGENERATE AND DELIBERATE (2026-08-15). This pool held
    # [qwen3-coder-next:latest, qwen2.5-coder:32b]; both became qwen3.8:latest,
    # so it collapses to ONE worker whose synthesizer is the SAME model — 3.8
    # drafts once, then merges its own single draft. That is strictly worse than
    # answering directly, and it is the only `audrey_local` pool in that state.
    # ▶ A repair needs a SECOND LOCAL MODEL THAT ACTUALLY EXISTS.
    # ⚠️ `granite4.1:30b` is NOT pulled on the box (checked 2026-08-15) despite
    # sitting in `model_registry.code` and `tool_capable_models` — so naming it
    # here would swap a degenerate pool for a dead one. Same for
    # `deepseek-r1:32b` and `olmo-3.1:32b`. Pull one first, or leave this as is.
    workers: ["qwen3.8:latest"]
    synthesizer: "qwen3.8:latest"
    fallback_synth: "qwen3.8:latest"
  reasoning:
    workers: ["deepseek-r1:32b", "qwen3.8:latest"]
    synthesizer: "qwen3.8:latest"
    fallback_synth: "qwen3.8:latest"
  general:
    workers: ["deepseek-r1:32b", "qwen3.8:latest"]
    synthesizer: "qwen3.8:latest"
    fallback_synth: "qwen3.8:latest"
  vl:
    workers: ["qwen3-vl:32b", "llava:34b"]
    synthesizer: "qwen3.8:latest"
    fallback_synth: "qwen3.8:latest"

# ─── Deep panel: research (audrey_research) ────────────────────────────
# A STAGED pipeline, not a flat panel. Each task type carries:
#   researchers  — Stage-1 fan-out (run concurrently; cloud doesn't touch the
#                  GPU gate, local serializes through it). Each grounds with
#                  web_search/kb_search on the bigger `react.research_worker`
#                  budget. Capped at `agentic.max_research_workers_cloud`.
#   verifier     — Stage-2 single pass: flags unsupported/anachronistic/
#                  too-precise claims in the merged findings.
#   factchecker  — Stage-3 single pass (tool-capable): web_search-confirms the
#                  high-risk/dated/current claims and emits a corrections block
#                  the writer applies. OPTIONAL — omit it and the stage is
#                  skipped (pipeline runs verify→write as before). Uses the
#                  `react.factcheck_worker` budget.
#   writer       — Stage-4 single pass: turns verified+corrected findings into
#                  the answer (no new facts). Its output IS the final answer.
#   fallback_synth — degrade target if the write stage fails.
# Validated by `_validate_deep_panel_pools` (staged branch). Opt-in only:
# selecting `audrey_research` is the signal — there is no auto-routing into it.
#
# glm-5.2 took `verifier` on 2026-07-30 (it already held researcher + writer).
# `factchecker` is the deliberate hold-out on deepseek-v4-pro: that stage runs a
# constrained-decoding pass pinned to the `FactCheckResult` schema, and
# `ledger.py:203-207` records glm-5.2 as one of the models that returned
# unusable JSON for nested schemas — `inlined_schema` works around it, but this
# is the one stage where a glm regression silently empties the corrections
# block (`_structure_factcheck_batch` is fail-soft: bad JSON → None → no
# corrections, no error). Promote it only after a clean research eval.
deep_panel_research:
  code:
    researchers: ["deepseek-v4-pro:cloud", "glm-5.2:cloud", "qwen3.8:latest"]
    verifier: "glm-5.2:cloud"
    factchecker: "deepseek-v4-pro:cloud"
    writer: "glm-5.2:cloud"
    fallback_synth: "glm-5.2:cloud"
  reasoning:
    researchers: ["deepseek-v4-pro:cloud", "glm-5.2:cloud", "qwen3.8:latest"]
    verifier: "glm-5.2:cloud"
    factchecker: "deepseek-v4-pro:cloud"
    writer: "glm-5.2:cloud"
    fallback_synth: "glm-5.2:cloud"
  general:
    researchers: ["deepseek-v4-pro:cloud", "glm-5.2:cloud", "qwen3.8:latest"]
    verifier: "glm-5.2:cloud"
    factchecker: "deepseek-v4-pro:cloud"
    writer: "glm-5.2:cloud"
    fallback_synth: "glm-5.2:cloud"
  # vl: the research path grounds with text tools; image turns force fast
  # anyway. Kept here so the pool resolves for every task type, with a
  # text-only researcher set (the deep path rebuilds prompts text-only).
  vl:
    researchers: ["deepseek-v4-pro:cloud", "glm-5.2:cloud"]
    verifier: "glm-5.2:cloud"
    factchecker: "deepseek-v4-pro:cloud"
    writer: "glm-5.2:cloud"
    fallback_synth: "glm-5.2:cloud"

# ─── Agentic behavior ──────────────────────────────────────────────────
agentic:
  # Max concurrent cloud workers per deep request, across all deep pools.
  # Ollama Pro caps parallel cloud calls (≈3); this keeps `2 cloud per
  # request × concurrent users` from blowing past it and 429-ing. Was an
  # implicit code default (3) — pinned here so it's visible and tunable.
  max_deep_workers_cloud: 3
  # Max concurrent cloud researchers for `audrey_research`'s Stage-1 fan-out,
  # independent of `max_deep_workers_cloud`. Research fans wider than normal
  # deep but must stay under Ollama Pro's ~3 parallel-cloud limit. Default 2:
  # two cloud researchers + one local fits the proven pool and leaves cloud
  # headroom for a concurrent normal-deep request.
  max_research_workers_cloud: 2
  # Phase 26 — research claim/source ledger (audrey_research only). When on, a
  # second mechanical pass structures each researcher's prose into a
  # claims+sources ledger that later stages (fact-check, writer, hedge policy)
  # reason over. Opt-in + staged: enabled here turns on Stage 1 (build the
  # ledger); it's carried but only progressively consumed as later stages ship.
  # Toggle live (no rebuild) to A/B against the prose baseline. Off by default.
  research_ledger:
    enabled: true
    # Stage 4 — deterministic selective hedging. When on, each surviving claim
    # gets a hedging disposition (state plainly / attribute to source / hedge)
    # computed from its source types + risk, handed to the writer as per-claim
    # guidance. Separate flag so it can be A/B'd against a ledger-on baseline
    # (it changes writer wording — plain statement becomes explicitly allowed).
    # Requires `enabled: true` to have any effect. Off by default.
    hedge_policy: true
  # Debug/eval: when true, deep-panel answers end with a "## Panel drafts
  # (debug)" section carrying every worker's full draft (model, latency, tool
  # rounds) so draft-vs-synth quality can be compared from the answer artifact
  # alone — the eval's saved answers file then holds both. Client-visible
  # only, never written to the chat archive. Deep panel only — research mode
  # has its own view (`debug_research_trace` below).
  # Off by default; flip for an eval window (restart, no rebuild), flip back.
  debug_panel_drafts: false
  # Debug/eval: research-mode counterpart. When true, audrey_research answers
  # end with a "## Research trace (debug)" section carrying the staged
  # pipeline's intermediates — every researcher's notes, the structured
  # claims+sources ledger, the verifier critique, per-claim fact-check
  # verdicts, and the corrections/hedge-disposition blocks exactly as handed
  # to the writer — so a soft answer can be traced to its stage (thin notes
  # vs aggressive claim drops vs writer timidity) from the answer artifact
  # alone. Client-visible only, never written to the chat archive.
  # Off by default; flip for an eval window (restart, no rebuild), flip back.
  debug_research_trace: false
  # Debug/eval: what the model is actually LOOKING AT. Logs one
  # `context-trace:` line per ReAct round and one marked FINAL immediately
  # before the forced final answer, carrying the live tool results with their
  # sizes, how many were replaced by compaction stubs, and the total
  # conversation length. Log-only — never client-visible.
  #
  # ⚠️ Added 2026-08-12 after fourteen A-B runs were diagnosed purely from
  # answers. The answers cannot separate the two explanations that matter —
  # a model INVENTING "I only have a partial excerpt", and a model correctly
  # describing a context `compress_keep_last` had already thinned to one tool
  # result. Failures run 7–17% at 0–2 successful tool calls and 41% at three,
  # which is precisely where the second compaction pass bites.
  #
  # Off by default; flip for one diagnostic run (restart, no rebuild), read
  # the FINAL lines against that run's answers, flip back.
  debug_context_trace: false
  react:
    # When a turn stops with `list_my_files` as its only successful call and
    # names exactly ONE listed file that still has unread artifacts, fetch that
    # artifact and make the model answer again with the text in front of it.
    # Full rationale, and what each clause is there to skip, in
    # `pipeline/react.py` above `_unread_fetch`.
    #
    # ⚠️ This is deliberately NOT another sentence of instruction. Three text
    # levers were tried first (tool description, task-role prompt, the
    # `artifacts` → `unread_artifacts` rename); the third cut fabrication on
    # these turns from ~71% to ~17%, and the residue is a sampling coin-flip —
    # two turns holding byte-identical context produced an invented result and
    # a correct refusal. More words cannot reach that.
    #
    # Costs one tool call + one generation, on ~0.8% of turns measured over
    # 4,358 archived answers. Set false to A-B it.
    catalogue_guard: true
    max_rounds: 3
    compress_after_round: 2
    # 2000 → 6000 (2026-08-05), and this number had gone stale rather than
    # been wrong. It was set when every tool returned a snippet: a web_search
    # result is a title and ~150 chars. Video ingest then started producing
    # 250-token transcript chunks, and `tests/test_tool_truncation.py`
    # measures what that does — at 2000 chars a `kb_search` over a transcript
    # delivers **1 of 20 hits, at every top_k**. A model asked "what did they
    # say in the video" was answering from 992 characters and correctly
    # reporting that it could only give a partial excerpt.
    #
    # The other roles were each raised after hitting this same wall in their
    # own way — deep_worker to 4000 (2026-07-21, workers narrating stubs as
    # "empty results"), research_worker to 6000. **The fast path was left at
    # the default and it is the one every ordinary chat turn uses.**
    #
    # 6000 buys 4 transcript hits instead of 1. The cost is context: worst
    # case is `compress_keep_last` verbatim tool messages at this size, and
    # after `compress_after_round` that is 1. ⚠️ Per the A-B-A rule this wants
    # a before/after/before check rather than being trusted on arithmetic —
    # the measurement says what fits, not whether answers got better.
    max_tool_result_chars: 6000
    # How many *most-recent* `role=tool` messages to keep verbatim once
    # compression kicks in. Older tool messages collapse to a one-line
    # stub. Sensible values are ≥1; setting 0 happens to be a no-op under the
    # current helper (no compression) — to wipe history aggressively, lower
    # `compress_after_round` instead.
    #
    # ⚠️⚠️ 1 → 4 (2026-08-12). The old comment said "the model only ever needs
    # the immediately preceding tool round to keep reasoning". That is FALSE
    # for a paging tool and for any multi-file question, and it is the leading
    # explanation for fourteen A-B runs of video failures.
    #
    # With `max_rounds: 3` and `compress_after_round: 2`, compaction runs at
    # round 2 AND again before the forced final answer, so a turn that made
    # three `get_file_text` calls writes its answer holding ONE page and three
    # stubs. Measured over every archived video answer:
    #
    #   successful tool calls in a turn  →  fail rate
    #     0: 16.9% (n=83)   1: 14.2% (n=155)   2: 6.9% (n=101)
    #     3: 41.1% (n=95)   4–5: ~31% (n=38)
    #
    # A cliff at three, not a gradient. `video-long-transcript-paging` fails 0
    # of 14 turns below three calls and 20 of 32 at three; the cases that need
    # only the LAST result (`control-named-scoped`, 0 of 23 at three calls) are
    # untouched. That split is what `keep_last: 1` predicts exactly.
    #
    # ⚠️ FALSIFIABLE, and that is the point: if the three-call cliff survives
    # this change, compaction is NOT the cause and the failures really are
    # model behaviour. Run it with `agentic.debug_context_trace: true` and read
    # the `context-trace: … FINAL` lines, and with `--repeat` — a single 24-case
    # run cannot resolve a ±5 swing.
    #
    # ⚠️ THE RISK IS CONTEXT OVERFLOW, and it is not hypothetical: nothing in
    # this repo sets `num_ctx`, so Ollama's per-model default applies and an
    # over-long conversation is truncated FROM THE FRONT — taking the system
    # prompt with it. 4 × `max_tool_result_chars` is ~24k chars ≈ 6k tokens
    # before anything else. That is why this is 4 and not 8. `convo_chars` in
    # the context trace is there to watch it; if it climbs near the model's
    # window, lower this or set `num_ctx` explicitly before blaming the answer.
    compress_keep_last: 4
    # Per-worker cap on dispatched `web_search` calls (0 = unlimited).
    # Every dispatched search spends real provider quota (Brave), and panel
    # modes multiply it by worker count — pre-cap research requests burned
    # 30–45 searches each. Over-budget calls get a budget-note tool message
    # (never dispatched) and web_search stops being offered for the rest of
    # the loop. kb_search/memory are local and never capped.
    max_web_searches: 3
    # Deep-panel workers run ReAct with a tighter budget than fast path:
    # N workers × M rounds multiplies, and each local worker holds the GPU
    # gate for the whole loop (see pipeline/deep_panel.py).
    deep_worker:
      # ⚠ compress_keep_last COUNTS TOOL MESSAGES, NOT ROUNDS. One round can
      # dispatch several tools at once, so rounds are the wrong unit and
      # "keep_last == max_rounds" protects nothing. This block previously said
      # it did; that was wrong. On 2026-07-21 deep_worker ran keep_last=3
      # against a worker holding 7 tool messages (4 web_search + 1 memory_search
      # + 2 failed web_fetch) — all four searches were stubbed while the two
      # FAILURES were kept, and the worker reported its searches "returned empty
      # results" despite 12k chars having been fetched. Budget it against the
      # tool-call ceiling instead: max_web_searches (4) + headroom for
      # kb/memory/web_fetch ≈ 8. react.py now also evicts errors before
      # successes, so overflow can no longer drop grounding in favour of junk.
      max_rounds: 3               # was 2
      compress_after_round: 3     # was 2
      max_tool_result_chars: 4000 # was 2000 (research_worker uses 6000)
      compress_keep_last: 8       # was 3 — sized to TOOL MESSAGES, not rounds
      # 3 workers × 4 searches ≤ 12 Brave calls per deep request. Raised
      # 3→4 (2026-07-08) — Brave renewed, SearXNG absorbs overflow, so the
      # per-request cap can carry more headroom than the renewal-era floor.
      max_web_searches: 4
    # `audrey_research` Stage-1 researchers run with a deliberately bigger
    # budget than deep_worker: the +10 Euclid post-mortem found the tight
    # deep_worker budget (2 rounds, 2000 chars) made grounded workers rush
    # final answers from truncated snippets. Research mode is opt-in and
    # thoroughness-first, so researchers get room to search, read, and refine.
    research_worker:
      max_rounds: 5
      compress_after_round: 3
      max_tool_result_chars: 6000
      # ⚠ COUNTS TOOL MESSAGES, NOT ROUNDS — see the deep_worker note above.
      # This is why the same regression kept coming back: at keep_last=1 a
      # heavy-search worker had all but its final round compacted before it
      # wrote, then narrated the stub as "searches returned elided results"
      # (current-2025-recent, 2026-06-30); raised 2→3 (2026-07-07) after a
      # refusal caused by early-round eviction (parallel-postulate deepseek,
      # run 3); the run-6 gate (2026-07-08) STILL showed "compacted out before
      # I could read them" at keep_last=3 (pythagoras/archimedes/library/
      # current-2025), and 5 was declared "terminal". It was not. Every one of
      # those bumps was reasoned in rounds against code counting messages, so
      # each only shrank the window: keep_last=5 against max_web_searches=6
      # guarantees eviction on any thorough run, before other tools are counted.
      # Budget against the tool-call ceiling: 6 searches + headroom ≈ 12.
      # Research mode is thoroughness-first; the extra context is worth it,
      # watch per-case latency. If max_web_searches rises, raise this with it.
      compress_keep_last: 12      # was 5 — sized to TOOL MESSAGES, not rounds
      # 3 researchers × 6 searches ≤ 18 Brave calls per research request
      # (plus the fact-checker's 4) — tops out ≈22, still half the 30–45
      # pre-cap. Raised 4→6 (2026-07-08): Brave renewed as primary with
      # SearXNG absorbing overflow, and run 5 showed 5-round workers
      # exhausting the 4-search budget by round 2–3 then pivoting to
      # kb/memory/chat calls that returned junk while inflating round counts
      # (which fed compaction pressure). More web headroom grounds better
      # AND cuts the junk-tool pivot.
      max_web_searches: 6
    # `audrey_research` Stage-3 fact-checker: confirms a handful of specific
    # high-risk/dated/current claims against sources — NOT open-ended research.
    # Tighter than research_worker (fewer rounds) but keeps the large result
    # budget so it can read an authoritative page when it finds one.
    factcheck_worker:
      max_rounds: 3
      compress_after_round: 2
      max_tool_result_chars: 6000
      # ⚠ COUNTS TOOL MESSAGES, NOT ROUNDS — the same defect the two blocks
      # above were fixed for, and the last place it survived (found 2026-08-12
      # while confirming the fast-path paging fix). At 1, a fact-checker that
      # dispatched four searches arrived at its final answer holding ONE of
      # them, with `compress_after_round: 2` and the pre-final pass both
      # compacting. That is exactly how `research_worker` came to narrate its
      # own compaction as "searches returned elided results".
      #
      # Budgeted against the tool-call ceiling like its siblings:
      # `max_web_searches: 4` + headroom for a kb/memory/web_fetch call ≈ 6.
      # ⚠ NOT 8 (deep_worker's number): this block keeps 6000-char results
      # where deep_worker keeps 4000, so 8 here would be ~48k chars of tool
      # output alone. Nothing in this repo sets `num_ctx`, so an over-long
      # conversation is truncated FROM THE FRONT, taking the system prompt —
      # and this worker runs with `format=`, where losing the schema
      # instruction breaks the JSON rather than thinning the prose. 6 × 6000
      # ≈ 36k chars ≈ 9k tokens, which the `context-trace:` line will show as
      # `convo_chars` if it needs revisiting.
      #
      # ▶ UNMEASURED in the factcheck path — the evidence behind this is the
      # rule, not a fact-check A-B. Watch a research run's corrections stage
      # before trusting it.
      compress_keep_last: 6
      # Raised 3→4 (2026-07-08) alongside the research_worker bump.
      max_web_searches: 4
  planning:
    enabled: true
    # Below this, the prompt runs whole (no decomposition) and every worker
    # answers the full question. Raised 40→120: a short standalone prompt split
    # into subtasks hands each worker a bare fragment that can lose the original
    # subject ("...tradeoffs between the leading ones?" with no "Rust runtimes"),
    # so the worker searches chat history for the missing referent and asks to
    # clarify — wasting a panel slot. 120 keeps decomposition for genuinely
    # multi-part asks while letting short single-topic prompts run whole.
    min_prompt_tokens: 120
    max_subtasks: 3        # matches the 3-worker text deep-panel pools; prevents dropped subtasks
  reflection:
    enabled: true
    max_retries: 1
    # 40 chars = roughly one short sentence floor. Phase 25 dropped from
    # 80 because the new synth prompt produces tighter answers and 80
    # was triggering false-positive retries on legitimately-brief
    # responses (e.g. "what year is it" → "It is 2026.").
    min_answer_chars: 40
  escalation:
    enabled: true
    min_chars: 100
    confidence_ceiling: 0.95
  memory:
    enabled: true
    top_k: 3                       # recall hits to inject into the prompt
    # Short — recall runs on the hot path of every request and shouldn't block
    # it. This is the tightest deadline anywhere in the system, so it is the
    # OUTER rung of a ladder: custom-tools' MEMORY_EMBED_TIMEOUT_S (4s) must
    # stay below it. Raising this without raising that one re-inverts the
    # ladder and every stall reads as a bare timeout again. Pinned by
    # tests/test_kb_timeout_ladder.py.
    timeout_s: 5

# ─── Timeouts (seconds) ────────────────────────────────────────────────
timeouts:
  router: 20
  small: 60
  medium: 180
  large: 360
  cloud: 240
  # Per-worker deadline for local-holding deep pools (deep_panel,
  # deep_panel_local). Local workers serialize through the single GPU gate,
  # so a worker that runs second cold-loads after the first is evicted —
  # load + generate has to fit in this window. Bumped 240 → 360 after a
  # local worker hit a 240.00s ReadTimeout mid-cold-load (Phase 21).
  deep_worker: 360
  fast_path: 180

# ─── Cache ─────────────────────────────────────────────────────────────
cache:
  enabled: true
  max_entries: 256
  ttl_seconds: 600

# ─── Search ────────────────────────────────────────────────────────────
search:
  backend: brave             # brave | searxng (future)
  max_results: 5
  cache_ttl_hours: 24

# ─── Knowledge base ────────────────────────────────────────────────────
kb:
  text_collection: "kb_text"
  image_collection: "kb_images"
  text_embedder: "nomic-embed-text"      # via Ollama /api/embed, 768-d
  # How long Ollama holds the embedder in VRAM after a call. Ollama's default
  # is 5 minutes, which is shorter than the gap between bursts of chat on a
  # personal box — so the embedder was cold on effectively every query.
  # Measured 2026-08-10 on an idle box: cold 4.18s, warm 0.059s. It is a 137M
  # model at 323 MB, so residency is close to free on 48 GB.
  # ⚠️ It occupies one `OLLAMA_MAX_LOADED_MODELS` slot while resident (that env
  # var is 2 on this box). Set to null to send no field and take Ollama's
  # 5-minute default back.
  text_embedder_keep_alive: "24h"
  image_model: "clip-ViT-B-32"           # via sentence-transformers, 512-d
  # Cosine floor for kb_search text hits. The KB always returns its top_k
  # NEAREST vectors regardless of distance, so an off-domain query (this KB
  # holds geology/botany/bushcraft/fishing — NOT medicine) gets the
  # least-irrelevant junk, which pollutes a researcher's context and reads as a
  # real source (2026-07-15 trace: a vaccine query returned PowerApps /
  # ServiceNow docs). A floor turns "nothing relevant" into an EMPTY result the
  # researcher handles gracefully. 0.0 = OFF.
  # 0.53 is set from real box probes (2026-07-16, unit-normalized nomic-embed
  # cosine): on-domain "what drives plate tectonics" scored 0.570–0.590 (all 5
  # hits real geology); off-domain "how do mRNA vaccines work" scored 0.487–0.519
  # (all junk). 0.53 sits in the valley — above every junk hit, comfortably below
  # the real cluster with headroom for weaker-but-genuine on-domain hits. Re-probe
  # `/v1/kb/query` and re-tune if the corpus changes; bias LOW (keep real hits)
  # over HIGH (cut junk) — dropping real grounding is the costlier error.
  min_score: 0.53
  chunk_tokens: 1000
  chunk_overlap: 100

  # ─── Hybrid retrieval (Phase 39) ─────────────────────────────────────
  # A BM25 lexical retriever beside the dense one, merged by rank. The dense
  # vectors find text that *means* what you asked; this finds text that *says*
  # it. Measured 2026-08-03: a 10-word paraphrase returned its chunk at 0.796
  # while a 6-word phrase appearing verbatim in the same transcript returned
  # nothing at all. No embedder change and no floor setting fixes that — at
  # 630 characters the correct passage scored 0.460 against an unrelated
  # decoy's 0.431, so the retriever had stopped discriminating, not merely
  # become strict.
  hybrid:
    # Migration ran 2026-08-03: kb_text (15,913 points) and all three
    # kb_user_text_* rebuilt with a bm25 vector, counts verified, dense
    # vectors carried over unchanged. `scripts/migrate_bm25.py` is idempotent
    # and skips anything already migrated, so a new deployment runs it once
    # before turning this on.
    enabled: true
    # Reciprocal rank fusion's damping constant, from the original paper and
    # Qdrant's own default. It flattens the gap between top positions — rank 1
    # scores 1/61, rank 2 scores 1/62 — so a chunk both retrievers liked
    # outranks one that a single retriever loved. Agreement is the signal.
    rrf_k: 60
    # The evidence rule that replaces `min_score` on the lexical side. BM25
    # scores are unbounded and corpus-relative, so no threshold means the same
    # thing twice; "the chunk contains 70% of the meaningful words you asked
    # for" means the same thing in every corpus at every size. Function words
    # do not count toward it — see `kb/bm25.py`.
    #
    # Was 0.5 for one deployment on 2026-08-03 and that was too loose: "how do
    # mRNA vaccines work" returned PowerApps and ServiceNow docs, because
    # `how`/`do`/`work` alone cleared the bar.
    #
    # Re-measured against the passages that actually came back, with function
    # words excluded: junk scored 0.25, 0.33 and 0.667; genuine hits scored
    # 0.75 and 1.0. 0.7 is the gap. Note how narrow that is — the worst junk
    # case is one content word away from the best threshold, so this number
    # deserves re-measuring against any corpus with a different shape rather
    # than being treated as a constant. Lowering it is how 2026-07-15 returns.
    min_term_overlap: 0.7
  dataset_paths:                         # overridden by KB_DATASET_PATHS env var
    - "/datasets/geology"                # container path; host = /mnt/user/knowledge/<topic>
    - "/datasets/botany"
    - "/datasets/bushcraft"
    - "/datasets/fishing"
    - "/datasets/first-aid"
    - "/datasets/wilderness-first-aid"
    - "/datasets/herbal-medicine"
    - "/datasets/hunting"
    - "/datasets/survival"
    - "/datasets/bjj"
    - "/datasets/mma"
    - "/datasets/powerapps"
    - "/datasets/servicenow"
  watcher_debounce_seconds: 2

  # Periodic reconcile pass for the global kb_text + kb_images
  # collections. Catches drift the watcher misses (container restarts,
  # KB_WATCHER_ENABLED=0 stretches, bulk deletes outside audrey,
  # atomic-rename patterns watchdog handles unreliably). One sweep
  # runs immediately at startup; subsequent sweeps fire every
  # `interval_s`. Per-user collections (`kb_user_text_*` /
  # `kb_user_images_*`) are NOT touched — the sqlite uploads index
  # reconciles those at startup. Admin trigger:
  # `POST /v1/admin/kb/reconcile` for ad-hoc sweeps between intervals.
  reconcile:
    enabled: true
    interval_s: 1800                     # 30 min default; lower = more aggressive

  # Per-user uploads (Phase 13). Landing dir is bind-mounted from the host.
  upload_root: "/data/uploads"
  max_upload_mb: 50                      # per-file cap
  # 10 GiB per-user quota. Was 1 GiB, which predated video: three 300 MB
  # uploads exhausted it and the fourth was refused with terabytes free on the
  # array. It was also SMALLER THAN `chunked.max_upload_mb` below — the
  # transport advertised a 2 GiB single-file ceiling that the quota could never
  # accept, so the largest permitted upload was guaranteed to be rejected.
  # `_validate_upload_limits` now refuses that combination at boot.
  #
  # This bounds one user, not the array. It is not a disk-pressure control and
  # should not be tuned as if it were — see `kb.video.keep_source` for the
  # thing that was reaching for that job and should not have been.
  max_user_bytes: 10737418240

  # Phase 15: sqlite index over the per-user upload metadata. Qdrant is
  # still authoritative for the file's content; this is a fast index for
  # list + quota that doesn't require scrolling the whole collection.
  # Reconciled against Qdrant at startup.
  uploads_db_path: "/data/uploads.sqlite"

  # Phase 32: chunked upload transport. A single POST cannot carry a large
  # file — cloudflared fronts this app and the CDN edge refuses request
  # bodies past its plan limit (100 MB on Free/Pro/Business) before they
  # reach us, returning an HTML error page rather than our JSON. Slicing the
  # file into parts that each clear that ceiling is the only transport that
  # works through the tunnel, which is why `max_upload_mb` below is allowed
  # to dwarf the single-shot `max_upload_mb` above: that cap exists because
  # a single-shot body must survive the edge, and a chunked one need not.
  chunked:
    part_size_mb: 8                      # per-part body — keep far under the edge cap
    max_upload_mb: 2048                  # whole-file ceiling for chunked uploads
    session_ttl_minutes: 120             # abandoned part dirs swept after this

  # Phase 33: the media-worker job lifecycle. A video uploads to
  # `status='pending'` and nothing in audrey-ai will ever read it — extraction
  # is minutes of CPU and GPU and cannot live in a request. A separate worker
  # leases the row, does the work, and posts the result back over the service
  # token. Audrey stays the only writer of uploads.sqlite.
  video:
    # How long a lease is good for. Longer than the slowest job expected, or a
    # worker still working gets its job stolen out from under it; short enough
    # that a crashed worker's video is not stuck for an afternoon. Whisper on a
    # long file becomes the binding constraint once Phase 35 lands.
    #
    # Overridable from `.env` as VIDEO_LEASE_MINUTES — use that, not an edit
    # here, when shortening the lease to verify the sweep. Editing this file on
    # the box dirties the deployed working tree and has to be undone by hand,
    # and a forgotten revert leaves production on a one-minute lease with
    # nothing to notice it.
    lease_minutes: 30
    # Counts leases, not failures — a worker that dies silently never reports
    # one. Past this the row goes to 'failed' with a reason rather than cycling
    # forever and taking the worker down with it on every pass.
    # Overridable as VIDEO_MAX_ATTEMPTS.
    max_attempts: 3
    # Tokens per transcript chunk. Much smaller than the 1000 used for
    # documents: a 1000-token chunk of speech is three-plus minutes of talking,
    # which in an interview spans several speakers and several subjects. The
    # first real video proved it — a 25-word verbatim quote scored 0.586
    # against its own chunk, barely over the 0.53 `kb.min_score` floor, when an
    # exact match should be near 0.9. An exact quote a search cannot find is
    # the worst failure a retrieval substrate can have.
    transcript_chunk_tokens: 250

    # ─── Visual pass (Phase 36) ──────────────────────────────────────
    # Frames are sampled on CPU, thinned by `media/framegate.py`, and only
    # the survivors are described by the `vl` pool. At `gpu.concurrency: 1`
    # every describe call is exclusive GPU that a chat turn is waiting for,
    # so the thinning is not an optimisation — it is the difference between
    # a video ingest being a background cost and being an outage.

    # Seconds between sampled frames. 30s over a 9m25s video gives 19
    # candidates, which is the run the gate's 8-bit threshold was calibrated
    # against. Lowering it does not directly cost GPU — the gate absorbs
    # near-identical extras — but it does cost decode time and disk.
    frame_interval_s: 30

    # Hard cap on describe calls per video, applied AFTER the gate. The gate
    # thins by content and its answer is the good one; this thins by budget
    # and is always a loss, so it is capped rather than targeted — a video
    # whose gate output is under the cap pays nothing for it.
    #
    # 24 keeps the first runs finishing in a knowable time. Raise it once
    # phase 38 has real per-frame timings; that is the whole point of
    # shipping this instrumented rather than behind a flag.
    keyframes_max: 24

    # Longest edge of an extracted frame. A 4K frame carries no more legible
    # text than a 1080p one once the vision encoder resizes it, and costs
    # decode time at both ends. It also matters more than it looks: every
    # frame is base64'd into a JSON request body.
    frame_max_width: 1280

    # dHash bits that must differ before a frame earns its own describe call.
    # 8 was calibrated against one video (6 of 19 frames kept, 68% fewer GPU
    # calls) — a starting point, not a finding. Bias low: a redundant
    # description costs one GPU call, a dropped scene change costs coverage
    # nothing downstream can recover.
    #
    # Known blind spot: dHash is gradient-based, so it cannot see a cut
    # between two flat colour fields. Real footage has texture; a test
    # fixture full of solid colours will look like a broken gate.
    frame_dedup_distance: 8

    # ─── Summary (Phase 37) ──────────────────────────────────────────
    # One call over the transcript and the frame descriptions, stored on the
    # row for the file list and ingested as one chunk so chat can answer
    # "what is this video" without pulling 200 transcript chunks into context.

    # A CLOUD model by default, and that is the point: summarising is a text
    # task over text inputs, so it carries none of the image-capability risk
    # that made the `vl` pool local-only, and `FairLocalGate` is a no-op for a
    # non-local location. This is the one stage of video ingest that costs the
    # box no GPU at all. Naming a local model here works and puts a summary in
    # the same queue as the chat turn waiting behind it — for a stage nobody
    # is waiting on.
    summarise_model: "glm-5.2:cloud"

    # Characters of transcript + descriptions handed to the summariser. A
    # two-hour transcript is ~100k characters; bounding it here means the cut
    # is deliberate and evenly sampled across the video, rather than a
    # truncation partway through a sentence forty minutes in. Roughly 45
    # minutes of speech.
    summary_input_chars: 24000

    # Longer than the chat default because a summary reads a lot and is not
    # streamed to anyone. It also cannot fail the video — a summary that times
    # out leaves an empty field on a `ready` row.
    summary_timeout_s: 180

    # Tell the summariser not to think. Measured on `glm-5.2:cloud`
    # 2026-08-06, three samples per state:
    #
    #     omitted   27.7s   8994c thinking   2192c summary   2683 eval tok
    #     false      9.7s      0c            3542c summary    817 eval tok
    #
    # **3.3x fewer billed tokens for a longer summary.** This is the clearest
    # reasoning-is-discarded role in the registry: the summary is the product,
    # the reasoning is never shown to anyone, and the default model is billed.
    # Condensing a transcript is not a task that needs deliberation.
    #
    # ⚠️ Not a flat flag — sending `think` to a model that does not declare
    # `thinking` is a HARD ERROR, and `summarise_model` is yours to change.
    # The code asks Ollama first and omits the field on anything that cannot
    # think, or when the capability cannot be read. Getting that wrong would be
    # invisible: `SummaryUnavailableError` is swallowed by design, so it would
    # surface as summaries silently never appearing.
    #
    # Set false to go back to sending nothing, which is what happened before
    # 2026-08-06 — and note that "sending nothing" is NOT "not thinking": with
    # the field omitted the template thinks anyway, which is what the 8994c
    # above is.
    summary_no_thinking: true

    # ─── Source reclamation (Phase 38) ───────────────────────────────
    # OFF, and off is the right default. This deletes a file the user
    # uploaded.
    #
    # The phase-35 and phase-38 plans both assumed the opposite, on the
    # grounds that `max_user_bytes` is 1 GiB and three 300 MB videos exhaust
    # it. That is a real annoyance and it is not a reason to delete anyone's
    # video: 1 GiB is a number in this file, on a NAS. **Raise the quota.**
    # Reclaiming user data to fit a self-imposed limit is solving the wrong
    # problem, and it is the only irreversible operation in the pipeline.
    #
    # The tempting argument for deleting is that nothing can read the bytes
    # back — there is no download route, so a processed video's source is
    # write-only storage. That is true today and it is weak: it describes a
    # feature that does not exist yet rather than a decision that the file is
    # disposable. Add a download button later and every already-reclaimed
    # video is permanently broken, with no way to tell which ones.
    #
    # Turn this on only for genuine disk pressure on the box — a case where
    # the alternative is the array filling up, not a case where an accounting
    # number is inconvenient. Then note what it costs: a reclaimed video can
    # never be re-processed, so every later improvement to the visual or
    # summary stages applies only to videos uploaded afterwards.
    keep_source: true

    # The same decision for URL-sourced videos (Phase 41), and it comes out the
    # other way — false, meaning their bytes ARE reclaimed.
    #
    # Everything above argues from one fact: nothing can read the bytes back,
    # so deleting them is final. A fetched video breaks that premise. The row
    # keeps the URL it came from, and requeueing one whose source was reclaimed
    # now sends it to `fetch_pending` rather than refusing — the fetcher
    # downloads it again and the video re-processes. **That path is the whole
    # justification for this line.** If it is ever removed, this goes back to
    # true with it.
    #
    # What it costs is worth stating plainly: the video must still be at that
    # URL. Removals, takedowns and privacy flips are outside this box's
    # control, so a reclaimed fetch is recoverable in the ordinary case and not
    # in the case where the source disappeared — which is also the case where
    # the local copy would have been worth most. Set this true if that matters
    # more than the quota; nothing else changes.
    #
    # It does NOT touch the transcript, descriptions or summary. Those are the
    # ingest's output, they live in Qdrant, and the video stays fully
    # searchable after reclamation either way.
    keep_fetched_source: false

    # How long a processed video's bytes are kept before reclamation, timed
    # from when its ingest finished rather than from when it was uploaded. A
    # video that sat in a stalled queue for two days would otherwise become
    # eligible the instant it completed — a window of zero, for exactly the
    # file whose processing most deserved a second look.
    #
    # 24 hours is a judgement, not a measurement: it is how long it plausibly
    # takes to notice that an ingest produced something wrong, which is the
    # case requeue exists for. Every hour here is quota the user cannot
    # spend, so a longer window trades directly against the problem the
    # setting exists to solve.
    source_retention_hours: 24

  # ─── URL fetch (Phase 41) ────────────────────────────────────────────
  # Paste a link on the upload page and the box downloads the video into your
  # KB. One stage in front of the video queue above; everything after the
  # download is phases 33-38 unchanged and unaware a URL was involved.
  fetch:
    # Hosts this deployment will download from. **Exact matches, and an empty
    # list refuses everything** — see `_allowed_fetch_hosts`. Both properties
    # matter: suffix matching would admit `youtube.com.evil.test`, and a
    # permissive default would mean a deployment whose config predates this
    # setting silently acquires an open downloader with write access to every
    # user's upload directory.
    #
    # Deliberately NOT "whatever yt-dlp accepts", which is ~1800 sites, many of
    # them generic file hosts. That list would make this a general-purpose
    # downloader wearing a video-shaped name.
    allowed_hosts:
      - "youtube.com"
      - "www.youtube.com"
      - "m.youtube.com"
      - "youtu.be"

    # Per-URL ceiling, and the number the quota is pre-checked against when a
    # link is accepted — the real size is not knowable until the download
    # finishes, so this stands in for it. `fetch/{file_id}/result` re-checks
    # against the bytes that actually landed, which is the check that counts.
    #
    # Matches `kb.chunked.max_upload_mb`: a video you could have uploaded by
    # hand is exactly the video you should be able to fetch by link.
    max_bytes_mb: 2048

    # Refuse a stream longer than this from the metadata pass, before any bytes
    # are downloaded. 0 disables it. Two hours is already an hours-long ingest
    # downstream — phase 38 measured 458s for nine minutes — so this bounds the
    # download without being the binding constraint on anything reasonable.
    max_duration_s: 7200

    # Shorter than the ingest lease (30m) because a download is bounded by
    # bandwidth rather than by GPU, and a fetcher that has not finished a
    # size-capped file in twenty minutes is stuck rather than slow.
    lease_minutes: 20

    # Counts leases, not failures, exactly as `kb.video.max_attempts` does. A
    # private or deleted video fails identically on every attempt, so this only
    # bounds how long it takes to stop trying — the reason reaches the user on
    # the first failure either way.
    max_attempts: 3

    # Passed straight to yt-dlp's `--extractor-args`. Empty leaves yt-dlp's own
    # client selection alone.
    #
    # **This is the knob for "HTTP Error 403: Forbidden" on the download.** The
    # tell is a 403 on the *media* URL after a metadata pass that worked
    # perfectly: nothing is wrong with the video or the link, YouTube has
    # decided it will not serve the format URLs to the client yt-dlp identified
    # as. A failure at the *metadata* stage is a different problem — usually an
    # out-of-date yt-dlp, which says "not available on this app".
    #
    # `android_vr` **verified working on the box 2026-08-06** against a real
    # full download (31.9 MiB, adaptive formats 398+140, merged and remuxed).
    # Not a guess — see the verification recipe below, and re-run it rather
    # than trusting this line if downloads start failing.
    #
    # ⚠️ **Verify by running the actual download. Nothing smaller works.**
    # Three probe designs were tried here and the first two both reported the
    # known-broken client as OK:
    #
    #   - `-f worst` picks a small *pre-muxed* stream. The job requests
    #     adaptive `bv*+ba`, which is a different class of URL and the class
    #     YouTube actually gates.
    #   - `--download-sections "*0-3"` hands the fetch to ffmpeg as one range
    #     request. The job uses yt-dlp's own downloader for a sustained
    #     multi-minute transfer, and that is where the 403 appears.
    #
    # A probe that does not do what the job does is worse than no probe: it
    # tells you the broken thing works and you act on it. So:
    #
    #   FMT='bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720][ext=mp4]/bv*[height<=720]+ba/b[height<=720]/b'
    #   timeout 300 docker exec media-fetcher yt-dlp \
    #     --extractor-args "youtube:player_client=android_vr" \
    #     -f "$FMT" --merge-output-format mp4 --remux-video mp4 \
    #     --newline -o "/tmp/real.%(ext)s" --force-overwrites \
    #     -- "<a youtube url>" 2>&1 | tail -25
    #
    # **Keep the `2>&1`.** yt-dlp puts the reason on stderr, and every earlier
    # probe here discarded it — running blind by construction. Warnings about
    # `nsig` extraction or player JS appear there and say whether a failure is
    # about the client at all.
    #
    # Candidates worth trying if this one stops working:
    #   android_vr, tv, ios, mweb, web_safari, default
    #
    # It rides the claim, so this takes effect on the next claim after
    # `docker compose restart audrey-ai` — no image rebuild.
    #
    # **A list, tried in order, first success wins.** One client is a single
    # point of failure with a manual fix: when YouTube stops serving it, every
    # fetch fails at once and stays failed until someone edits this file.
    # Walking a list turns that into a slower first download and a log line.
    #
    # The fetcher advances to the next entry only on failures another client
    # could plausibly fix — a private video is private to all of them, and
    # walking the list would spend a lease learning that six times.
    #
    # The final "" is yt-dlp's own default, kept last rather than dropped: it
    # is the entry most likely to start working again after a yt-dlp bump.
    extractor_args:
      - "youtube:player_client=android_vr"
      - "youtube:player_client=tv"
      - "youtube:player_client=ios"
      - "youtube:player_client=mweb"
      - "youtube:player_client=web_safari"
      - ""

    # How many of the clients above one job may try before giving up.
    #
    # **Low on purpose.** Every extra client is another request made at the
    # moment something is already wrong, and this deployment's whole risk
    # posture is not looking like something worth blocking. Two covers the case
    # that actually happens — one client retired, another still viable — and
    # stops well short of sweeping the list.
    #
    # ⚠️ **Measured 2026-08-06: only `android_vr` works.** `tv`, `ios`, `mweb`
    # and `web_safari` all failed a real download that day, and `default`
    # failed on sustained transfers. So the entries below the first are
    # *insurance against rotation*, not five working options — a client that is
    # dead today may come back after a yt-dlp bump, which is the case this
    # setting is buying.
    #
    # **Currently 1: fallback is OFF** (user's call, 2026-08-06). One attempt,
    # a clear reason on the row, and a human edits `extractor_args` when
    # YouTube moves. For a single-user box where someone notices within hours,
    # that trade is the right way round — it costs downtime and saves requests
    # at exactly the moment you least want to be making them.
    #
    # The fallback machinery stays in the fetcher and is inert at 1. Raise this
    # to 2 if downtime starts costing more than the extra requests; nothing
    # else needs changing, and it takes effect on the next claim after
    # `docker compose restart audrey-ai`.
    max_client_attempts: 1

# ─── Tools (OpenAPI auto-discovery) ────────────────────────────────────
tools:
  enabled: true
  servers:                               # overridden by TOOL_SERVERS env var
    - "http://custom-tools:8001"
  max_rounds: 5

# ─── Complexity gate ───────────────────────────────────────────────────
complexity:
  token_threshold: 500                   # pasted content this large forces deep panel
  log_breakdown: false                   # when true, emit per-role token sums alongside each complexity line (Phase 6a investigation)
  # Phrases that force `audrey_auto` to the deep panel regardless of length.
  # The token gate above catches *long* prompts; these catch the "short prompt,
  # big ask" case (a 30-token "compare the top 3 X, thorough, think hard" reads
  # trivial to a length gate but wants multi-draft synthesis). Substring match
  # on the latest user message, case-insensitive. Keep these to UNAMBIGUOUS
  # depth cues — "analyze"/"compare" alone are too common (they'd send casual
  # one-liners to deep). Empty list = feature off. (Phase 22.)
  deep_intent_phrases:
    - "think hard"
    - "deep dive"
    - "in depth"
    - "in-depth"
    - "comprehensive"
    - "step by step"
    - "step-by-step"
    - "thorough"
    - "exhaustive"
    - "detailed analysis"

debug:
  log_incoming_payload: false            # when true, log role+content-length for every incoming chat message (Phase 6a OWUI shape investigation)
  log_incoming_payload_content: false    # when true, log first 500 chars of every incoming chat message — PII-bearing, leave off in normal operation

# ─── GPU concurrency ───────────────────────────────────────────────────
gpu:
  concurrency: 1                         # local-model semaphore; cloud bypasses

# ─── Per-user fairness (Phase 20) ──────────────────────────────────────
# Layer 1 (FairLocalGate): round-robin across users at the local-GPU
# acquire point. Cloud calls bypass. No knob — replaces the old GpuGate.
# Layer 2 (in-flight cap): bounds how many concurrent pipeline requests
# one user can hold across the whole pipeline. Soft — extra requests
# wait, never error.
fairness:
  max_inflight_per_user: 3               # concurrent requests per user
  max_tracked_users: 1024                # LRU cap on the in-flight registry

# ─── Vision sidecar ────────────────────────────────────────────────────
# Only the models in `model_registry.vl` have a vision encoder. Everything
# else is text-in/text-out — hand `glm-5.2:cloud` an attached image and it
# either errors or answers blind. With this on, a local vision model
# transcribes the image first and the description is spliced into the
# message list as text, so the model the caller actually picked is still
# the one that answers. Fires only when a request carries an image, so a
# text-only turn pays nothing.
#
# Applies to `audrey_passthrough/<concrete>` (any non-vl target) and to an
# explicit deep pick (`audrey_deep`/`audrey_cloud`/`audrey_local`/
# `audrey_research`). Bare `audrey_auto` / `audrey_fast` still route image
# turns straight to the vl pool — no explicit pick to honour there, and a
# vision model answering directly beats reasoning over a description.
vision:
  describe_for_text_models: true
  # Which vl model does the transcribing. Commented out = highest-priority
  # healthy member of the `vl` pool, which keeps failover and health
  # tracking identical to every other dispatch.
  # model: "qwen3-vl:32b"
  timeout_s: 120                         # a dense screenshot is a slow decode
  max_images_per_turn: 4                 # local calls serialize on the GPU gate
  cache_size: 64                         # OWUI resends the data URI every turn
  # ▶ **OPEN DECISION (2026-08-15): `qwen3.8:latest` CAN SEE.** `ollama show`
  # reports a `vision` capability and a 460M-param CLIP projector. It is not
  # listed here, so Audrey treats it as text-only and the sidecar transcribes an
  # image to prose before handing it over — a fidelity hop the model does not
  # need. Adding it would let image turns reach it directly.
  # ⚠️ NOT done yet, deliberately: this changes routing on the image path, and
  # that path has never been exercised end-to-end (the sidecar itself is still
  # an unvalidated item). Verify a real image turn in OWUI on the *Audrey*
  # connection before adding it, not after.
  also_capable: []                       # vision models that aren't in the vl pool

  # ─── Sampling (Phase 38) ─────────────────────────────────────────────
  # Measured on the box 2026-08-04, six keyframes through qwen3-vl:32b:
  # generation was 254.5s of a 291.1s visual pass — 87%. Queue was 0.0s on
  # every call, model load was 20.1s on the first frame and 0.2s on the rest,
  # and prefill was 2.3s. So every lever the phase-38 plan ranked (batching,
  # downscaling, a cloud vl model, concurrency) attacks at most 13% between
  # them, and `keep_alive` attacks a cold start that happens once.
  #
  # What generation was actually spent on: 9,486 tokens produced 12,490
  # characters of description. That is 1.3 chars/token where prose runs at
  # ~4 — roughly two thirds of everything generated never reached the output.
  # `ollama show qwen3-vl:32b` lists `thinking` among its capabilities, and
  # thinking tokens are counted in `eval_count` but are not in
  # `message.content`.

  # Off, because this model's only job is to transcribe what is in front of
  # it. The prompt already forbids answering, reasoning about, or speculating
  # on the image, so the reasoning is being paid for and then discarded — on
  # the ingest path where nobody is waiting, and on the chat path where
  # someone is.
  #
  # Set to `null` (not `false`) to send no thinking field at all. That is
  # required if any model in the `vl` pool lacks the `thinking` capability:
  # Ollama rejects the field outright rather than ignoring it, so `false`
  # would break that model's calls entirely. Check with
  # `docker exec ollama ollama show <model>` before adding to the pool.
  think: false

  # This cap has been wrong twice, in the same direction, for the same reason:
  # **it is spent on thinking before any description is written.**
  #
  # 1024 first, sized by dividing characters by an assumed ~4 chars/token. The
  # real content ratio is ~1.9, so it bit on frame one — 636 characters out,
  # against neighbours at 2,181 — and three later frames hit it before emitting
  # anything at all, returned empty, were 502'd and dropped.
  #
  # 2048 next, and `scripts/vision_probe.py` showed that is still not enough:
  # on a cluttered office frame, three of six runs spent all 2,048 tokens
  # reasoning and produced ZERO characters. The reasoning is unavoidable —
  # neither `think: false` nor Qwen3's `/no_think` reduces it (93-101% of
  # baseline either way) — so the budget has to cover thinking AND the answer.
  #
  # 4096 costs nothing on an easy frame, because this is a ceiling and a frame
  # that finishes at 300 tokens is billed for 300. It only ever spends more on
  # the frames that would otherwise be lost entirely. The visual pass is still
  # bounded by `FRAME_BUDGET_S` and the lease, which is where a runaway is
  # meant to be caught — not here, where being caught means losing the frame.
  num_predict: 4096

  # The model ships at temperature 1.0, which is a creativity setting applied
  # to a transcription task. It is also the likeliest cause of the known
  # non-determinism in description length between requeues of an unchanged
  # video (15 visual chunks one run, 17 the next). Lower is not obviously
  # better for prose quality, so this is the knob to A-B first if the
  # descriptions get worse.
  temperature: 0.3

# ─── Passthrough virtual model ─────────────────────────────────────────
# audrey_passthrough/<concrete_model> forwards the request directly to
# Ollama with no classifier, no complexity gate, no banners. Both fair-
# scheduling layers (FairLocalGate, UserInflightRegistry) still fire so
# direct-Ollama clients can be brought under Audrey's GPU contention
# story. The prefix scheme lets clients pick the concrete model per
# request. /v1/models lists one entry per allowed concrete.
passthrough:
  enabled: true

  # Thinking for passthrough turns. `null` sends no `think` field at all,
  # which is today's behaviour and what serving clients should get: their
  # request is forwarded verbatim and the OpenAI schema has no thinking knob.
  #
  # It exists for the eval sweeps, which reach their models only through this
  # route. Probed 2026-08-12, three samples each, NUM_PREDICT=2048:
  #
  #     model                     omitted           true              false
  #     qwen3.6:35b               8985c think, 0c   8928c think, 0c   —
  #     nemotron-3.5-lightning    9149c think, 0c   8941c think, 0c   0c, 3135c
  #     muse-glimmer              8548c think, 661c 8437c think, 743c 0c, 2398c
  #
  # Two things in that table. **`omitted` is not `off`** — the gap to `true`
  # is smaller than the within-state spread on all three, so the default is
  # thinking, nobody chose it, and a bake-off run this way compares three
  # unchosen reasoning budgets. And **thinking can consume the whole reply**:
  # the `0c` content cells are answers that spent all 2,048 tokens reasoning
  # and emitted nothing. That is the same failure `routes/media.py` already
  # names for the vision path.
  #
  # ⚠️ Set this in `.env` as `PASSTHROUGH_THINK`, not here — it is an
  # experiment, and a forgotten `false` in a tracked file silently changes
  # what every passthrough client (Claudette, Hermes, OpenClaw) gets.
  # ⚠️ Never sent raw: `ollama.thinking_flag` drops it for models that do not
  # declare `thinking`, because Ollama hard-errors on the field rather than
  # ignoring it.
  think: null

  allowed_models:                        # concrete models clients may target
    # ⚠️ NO 64k VARIANT ANY MORE, AND DO NOT BUILD ONE (2026-08-15).
    # `qwen3.6:35b-64k` and `qwen3-coder-next-64k:latest` were Modelfile builds
    # that RAISED a small default window to 65536. `ollama show qwen3.8:latest`
    # reports **context length 262144** natively, so a 64k variant would CAP the
    # model at a quarter of what it already does. The base tag below is the
    # long-context entry now.
    # ⚠️ Nothing in this repo sets `num_ctx`, so Ollama's per-model default is
    # what every call gets — which is the whole 262144 here. That is a much
    # larger default than the 35B-class models this config was tuned around;
    # if a long conversation starts costing latency, this is why.
    # Registry text-pool models (code + reasoning + general, deduped), exposed
    # for the per-model eval sweeps (scripts/eval_research.py --models
    # 'audrey_passthrough/<name>,…'): testing panel candidates in isolation is
    # how lineups get compared before editing the deep_panel* workers lists.
    # Keep in sync with model_registry when models are added/retired.
    # 2026-08-12 arrivals, added for the local bake-off
    # (scripts/eval_prompts_local_models.json). ⚠️ Local weights: nemotron
    # 25 GB + muse 18 GB + qwen3.6 23 GB was 66 GB against 48 GB of VRAM, so a
    # sweep across all three WILL swap models. `_expand_sweep` groups by model
    # so each loads once; do not reorder it into per-case grouping.
    # ✅ **qwen3.8:latest is 17 GB** (27.3B Q4_K_M, measured 2026-08-15) — the
    # smallest of the three and 6 GB under the qwen3.6 it replaced, so that sum
    # is now 60 GB. Still over 48 GB: a three-model sweep STILL swaps.
    - nemotron-3.5-lightning:latest
    - muse-glimmer:latest
    # One entry where there were three (qwen3.6:35b, qwen3-coder-next:latest,
    # qwen2.5-coder:32b) — deduped 2026-08-15.
    - qwen3.8:latest
    - minimax-m3:cloud
    - granite4.1:30b
    - deepseek-v4-pro:cloud
    - kimi-k2.7-code:cloud
    - glm-5.2:cloud
    - kimi-k2.6:cloud
    - deepseek-v4-flash:cloud
    - deepseek-v3.2:cloud
    - cogito-2.1:671b-cloud
    - deepseek-r1:32b
    - nemotron-3-super:cloud
    - qwen3.5:397b-cloud
    - glm-4.7-flash:q8_0
    - olmo-3.1:32b
    - llama4:latest
    # Vision-language pool, exposed so an image-capable model can be targeted
    # directly. Batch image work (Phase 36 media-worker keyframe description)
    # reaches the GPU through passthrough precisely so both fair-scheduling
    # layers still fire — a sidecar calling Ollama itself would contend behind
    # FairLocalGate's back, since the gate is in-process to audrey-ai.
    # These are the only entries here that receive pixels rather than prose:
    # an image turn to a vl target forwards untouched, with no transcription
    # hop (`test_image_to_vision_capable_model_is_forwarded_untouched`).
    # Side effect, accepted: /v1/models lists one entry per allowed concrete,
    # so OWUI users can now pick these two directly as well.
    - qwen3-vl:32b
    - llava:34b
  require_role: null                     # null | "admin" — gate by OWUI role

# ─── Classification pre-filter ─────────────────────────────────────────
classification:
  keyword_prefilter:
    enabled: true
  review_override:
    enabled: true                        # "review this code" → reasoning, not code
  web_search_regex_set: "default"        # matches time-sensitive / factual / current-info
