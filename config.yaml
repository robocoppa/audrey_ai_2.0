# Audrey AI — runtime config
# Env vars override any value here via ${VAR} interpolation in loader.
# Reloaded at startup only. For live tool re-discovery see POST /v1/tools/rediscover.

version: "7.0.0"

router:
  model: "qwen3:4b"
  timeout_s: 20
  max_failures_before_fallback: 2
  # Skip the router LLM call for short prompts (<= N tokens) that produced no
  # strong keyword signal — they're almost always `general` (the tool-capable
  # fast path), so the round-trip is low-value and, on a busy GPU, the main
  # reason the fast-path Thinking banner lagged. Weak keyword signals are still
  # honored. Set 0 to always call the router. Conservative default.
  skip_llm_under_tokens: 8

# ─── Model registry ────────────────────────────────────────────────────
# Per task type, ranked by priority (higher = preferred when healthy).
# Speed/quality are informational hints used by the planner when building panels.
model_registry:
  code:
    - { name: "qwen3-coder-next:latest",  priority: 100, speed: 60, quality: 95, location: local }
    - { name: "minimax-m3:cloud",         priority:  98, speed: 85, quality: 96, location: cloud }
    - { name: "qwen2.5-coder:32b",        priority:  90, speed: 70, quality: 90, location: local }
    - { name: "granite4.1:30b",           priority:  82, speed: 80, quality: 86, location: local }
    - { name: "deepseek-v4-pro:cloud",    priority:  82, speed: 80, quality: 95, location: cloud }
    - { name: "kimi-k2.7-code:cloud",     priority:  92, speed: 90, quality: 94, location: cloud }
    - { name: "glm-5.2:cloud",            priority:  88, speed: 90, quality: 91, location: cloud }
    - { name: "qwen3.6:35b",              priority:  80, speed: 70, quality: 90, location: local }
    - { name: "kimi-k2.6:cloud",          priority:  78, speed: 90, quality: 92, location: cloud }
    - { name: "deepseek-v4-flash:cloud",  priority:  72, speed: 92, quality: 90, location: cloud }
    - { name: "deepseek-v3.2:cloud",      priority:  70, speed: 85, quality: 90, location: cloud }
    - { name: "cogito-2.1:671b-cloud",    priority:  65, speed: 80, quality: 93, location: cloud }

  reasoning:
    - { name: "qwen3.6:35b",              priority: 100, speed: 70, quality: 93, location: local }
    - { name: "deepseek-v4-pro:cloud",    priority:  97, speed: 80, quality: 95, location: cloud }
    - { name: "minimax-m3:cloud",         priority:  96, speed: 85, quality: 95, location: cloud }
    - { name: "kimi-k2.6:cloud",          priority:  95, speed: 90, quality: 94, location: cloud }
    - { name: "kimi-k2.7-code:cloud",     priority:  88, speed: 90, quality: 93, location: cloud }
    - { name: "deepseek-r1:32b",          priority:  85, speed: 65, quality: 90, location: local }
    - { name: "cogito-2.1:671b-cloud",    priority:  75, speed: 80, quality: 93, location: cloud }
    - { name: "nemotron-3-super:cloud",   priority:  70, speed: 85, quality: 90, location: cloud }

  general:
    - { name: "qwen3.6:35b",              priority: 100, speed: 75, quality: 92, location: local }
    - { name: "deepseek-v4-pro:cloud",    priority:  97, speed: 80, quality: 95, location: cloud }
    - { name: "minimax-m3:cloud",         priority:  96, speed: 85, quality: 95, location: cloud }
    - { name: "kimi-k2.6:cloud",          priority:  95, speed: 90, quality: 93, location: cloud }
    - { name: "kimi-k2.7-code:cloud",     priority:  88, speed: 90, quality: 92, location: cloud }
    - { name: "qwen3.5:397b-cloud",       priority:  90, speed: 80, quality: 94, location: cloud }
    - { name: "deepseek-v4-flash:cloud",  priority:  82, speed: 92, quality: 89, location: cloud }
    - { name: "glm-4.7-flash:q8_0",       priority:  80, speed: 85, quality: 87, location: local }
    - { name: "olmo-3.1:32b",             priority:  70, speed: 75, quality: 85, location: local }
    - { name: "llama4:latest",            priority:  65, speed: 55, quality: 90, location: local }
    - { name: "glm-5.2:cloud",            priority:  62, speed: 90, quality: 88, location: cloud }

  vl:
    # Vision-language pool — image turns on the chat path route here.
    # Local-only on purpose: only genuinely image-capable models belong in
    # this pool, and both locals below are vision models that are pulled on
    # the box. The previous pool led with nemotron3:33b (a text/reasoning
    # model) and listed unverified cloud entries — an image routed there
    # would be answered blind. qwen3-vl is the primary; llava the fallback.
    # nemotron3:33b keeps its reasoning + deep-panel-worker roles elsewhere.
    # (To add a cloud vl model later, confirm it actually accepts images.)
    - { name: "qwen3-vl:32b",             priority: 100, speed: 70, quality: 90, location: local }
    - { name: "llava:34b",                priority:  90, speed: 65, quality: 85, location: local }

# ─── Fast path ─────────────────────────────────────────────────────────
fast_path:
  enabled: true
  confidence_threshold: 0.88
  tool_capable_models:
    - "qwen3.6:35b"
    - "kimi-k2.7-code:cloud"
    - "kimi-k2.6:cloud"
    - "qwen3-coder-next:latest"
    - "qwen2.5-coder:32b"
    - "granite4.1:30b"
    - "deepseek-v4-pro:cloud"
    - "deepseek-v4-flash:cloud"
    - "deepseek-v3.2:cloud"
    - "qwen3.5:397b-cloud"
    - "cogito-2.1:671b-cloud"
    - "nemotron-3-super:cloud"
    - "minimax-m3:cloud"
    - "glm-5.2:cloud"

# ─── Deep panel: mixed (audrey_deep) ───────────────────────────────────
# One local + TWO cloud workers per task (text tasks). The local worker holds
# the GPU gate; both cloud workers run concurrently next to it (Ollama Pro caps
# at `agentic.max_deep_workers_cloud`, default 3), so the second cloud draft is
# near-free on wall-clock and gives the synthesizer a third, independent take.
# The two cloud models are deliberately different vendors for draft diversity.
# VRAM on the host fits one local model at a time (GPU_CONCURRENCY=1).
deep_panel:
  code:
    workers: ["qwen3-coder-next:latest", "kimi-k2.7-code:cloud", "deepseek-v4-pro:cloud"]
    synthesizer: "qwen3.6:35b"
    fallback_synth: "glm-5.2:cloud"
  reasoning:
    workers: ["qwen3.6:35b", "kimi-k2.6:cloud", "deepseek-v4-pro:cloud"]
    synthesizer: "qwen3.6:35b"
    fallback_synth: "glm-5.2:cloud"
  general:
    workers: ["qwen3.6:35b", "kimi-k2.6:cloud", "deepseek-v4-pro:cloud"]
    synthesizer: "qwen3.6:35b"
    fallback_synth: "glm-5.2:cloud"
  # vl stays one local + one cloud: the deep path rebuilds prompts text-only,
  # so the cloud workers never see the image — and image turns force the fast
  # path anyway (the local qwen3-vl is the real worker). A second cloud draft
  # here would merge a blind text take, so it isn't worth the call.
  vl:
    workers: ["qwen3-vl:32b", "kimi-k2.6:cloud"]
    synthesizer: "qwen3.6:35b"
    fallback_synth: "glm-5.2:cloud"

# ─── Deep panel: cloud-only (audrey_cloud) ─────────────────────────────
# Both workers run in parallel (Ollama Pro caps at 3 concurrent cloud).
deep_panel_cloud:
  code:
    workers: ["deepseek-v4-pro:cloud", "minimax-m3:cloud"]
    synthesizer: "deepseek-v4-pro:cloud"
    fallback_synth: "glm-5.2:cloud"
  reasoning:
    workers: ["deepseek-v4-pro:cloud", "qwen3.5:397b-cloud"]
    synthesizer: "deepseek-v4-pro:cloud"
    fallback_synth: "glm-5.2:cloud"
  general:
    workers: ["deepseek-v4-pro:cloud", "qwen3.5:397b-cloud"]
    synthesizer: "deepseek-v4-pro:cloud"
    fallback_synth: "glm-5.2:cloud"
  vl:
    workers: ["deepseek-v4-pro:cloud", "qwen3.5:397b-cloud"]
    synthesizer: "deepseek-v4-pro:cloud"
    fallback_synth: "glm-5.2:cloud"

# ─── Deep panel: local-only (audrey_local) ─────────────────────────────
# Both workers serialize through GpuGate (GPU_CONCURRENCY=1) — no parallelism.
# Worker ORDER matters here: the first-listed worker runs first (and loads
# cold first), so it's the de-facto primary. reasoning + general lead with
# deepseek-r1:32b, then qwen3.6:35b. (Dropped glm-4.7-flash:q8_0 from general:
# it was hitting the 240s deep_worker ReadTimeout — too slow to cold-load +
# generate when it ran second behind qwen3.6 through the single GPU.)
deep_panel_local:
  code:
    workers: ["qwen3-coder-next:latest", "qwen2.5-coder:32b"]
    synthesizer: "qwen3.6:35b"
    fallback_synth: "qwen3.6:35b"
  reasoning:
    workers: ["deepseek-r1:32b", "qwen3.6:35b"]
    synthesizer: "qwen3.6:35b"
    fallback_synth: "qwen3.6:35b"
  general:
    workers: ["deepseek-r1:32b", "qwen3.6:35b"]
    synthesizer: "qwen3.6:35b"
    fallback_synth: "qwen3.6:35b"
  vl:
    workers: ["qwen3-vl:32b", "llava:34b"]
    synthesizer: "qwen3.6:35b"
    fallback_synth: "qwen3.6:35b"

# ─── Deep panel: research (audrey_research) ────────────────────────────
# A STAGED pipeline, not a flat panel. Each task type carries:
#   researchers  — Stage-1 fan-out (run concurrently; cloud doesn't touch the
#                  GPU gate, local serializes through it). Each grounds with
#                  web_search/kb_search on the bigger `react.research_worker`
#                  budget. Capped at `agentic.max_research_workers_cloud`.
#   verifier     — Stage-2 single pass: flags unsupported/anachronistic/
#                  too-precise claims in the merged findings.
#   writer       — Stage-3 single pass: turns verified findings into the
#                  answer (no new facts). Its output IS the final answer.
#   fallback_synth — degrade target if the write stage fails.
# Validated by `_validate_deep_panel_pools` (staged branch). Opt-in only:
# selecting `audrey_research` is the signal — there is no auto-routing into it.
deep_panel_research:
  code:
    researchers: ["deepseek-v4-pro:cloud", "qwen3.5:397b-cloud", "qwen3.6:35b"]
    verifier: "deepseek-v4-pro:cloud"
    writer: "qwen3.6:35b"
    fallback_synth: "glm-5.2:cloud"
  reasoning:
    researchers: ["deepseek-v4-pro:cloud", "qwen3.5:397b-cloud", "qwen3.6:35b"]
    verifier: "deepseek-v4-pro:cloud"
    writer: "qwen3.6:35b"
    fallback_synth: "glm-5.2:cloud"
  general:
    researchers: ["deepseek-v4-pro:cloud", "qwen3.5:397b-cloud", "qwen3.6:35b"]
    verifier: "deepseek-v4-pro:cloud"
    writer: "qwen3.6:35b"
    fallback_synth: "glm-5.2:cloud"
  # vl: the research path grounds with text tools; image turns force fast
  # anyway. Kept here so the pool resolves for every task type, with a
  # text-only researcher set (the deep path rebuilds prompts text-only).
  vl:
    researchers: ["deepseek-v4-pro:cloud", "qwen3.5:397b-cloud"]
    verifier: "deepseek-v4-pro:cloud"
    writer: "qwen3.6:35b"
    fallback_synth: "glm-5.2:cloud"

# ─── Agentic behavior ──────────────────────────────────────────────────
agentic:
  # Max concurrent cloud workers per deep request, across all deep pools.
  # Ollama Pro caps parallel cloud calls (≈3); this keeps `2 cloud per
  # request × concurrent users` from blowing past it and 429-ing. Was an
  # implicit code default (3) — pinned here so it's visible and tunable.
  max_deep_workers_cloud: 3
  # Max concurrent cloud researchers for `audrey_research`'s Stage-1 fan-out,
  # independent of `max_deep_workers_cloud`. Research fans wider than normal
  # deep but must stay under Ollama Pro's ~3 parallel-cloud limit. Default 2:
  # two cloud researchers + one local fits the proven pool and leaves cloud
  # headroom for a concurrent normal-deep request.
  max_research_workers_cloud: 2
  react:
    max_rounds: 3
    compress_after_round: 2
    max_tool_result_chars: 2000
    # How many *most-recent* `role=tool` messages to keep verbatim once
    # compression kicks in. Older tool messages collapse to a one-line
    # stub. Default 1: the model only ever needs the immediately
    # preceding tool round to keep reasoning. Sensible values are ≥1;
    # setting 0 happens to be a no-op under the current helper (no
    # compression) — to wipe history aggressively, lower
    # `compress_after_round` instead.
    compress_keep_last: 1
    # Deep-panel workers run ReAct with a tighter budget than fast path:
    # N workers × M rounds multiplies, and each local worker holds the GPU
    # gate for the whole loop (see pipeline/deep_panel.py).
    deep_worker:
      max_rounds: 2
      compress_after_round: 2
      max_tool_result_chars: 2000
      compress_keep_last: 1
    # `audrey_research` Stage-1 researchers run with a deliberately bigger
    # budget than deep_worker: the +10 Euclid post-mortem found the tight
    # deep_worker budget (2 rounds, 2000 chars) made grounded workers rush
    # final answers from truncated snippets. Research mode is opt-in and
    # thoroughness-first, so researchers get room to search, read, and refine.
    research_worker:
      max_rounds: 5
      compress_after_round: 3
      max_tool_result_chars: 6000
      compress_keep_last: 1
  planning:
    enabled: true
    min_prompt_tokens: 40
    max_subtasks: 3        # matches the 3-worker text deep-panel pools; prevents dropped subtasks
  reflection:
    enabled: true
    max_retries: 1
    # 40 chars = roughly one short sentence floor. Phase 25 dropped from
    # 80 because the new synth prompt produces tighter answers and 80
    # was triggering false-positive retries on legitimately-brief
    # responses (e.g. "what year is it" → "It is 2026.").
    min_answer_chars: 40
  escalation:
    enabled: true
    min_chars: 100
    confidence_ceiling: 0.95
  memory:
    enabled: true
    top_k: 3                       # recall hits to inject into the prompt
    timeout_s: 5                   # short — semantic search through custom-tools is fast and shouldn't block the request hot path

# ─── Timeouts (seconds) ────────────────────────────────────────────────
timeouts:
  router: 20
  small: 60
  medium: 180
  large: 360
  cloud: 240
  # Per-worker deadline for local-holding deep pools (deep_panel,
  # deep_panel_local). Local workers serialize through the single GPU gate,
  # so a worker that runs second cold-loads after the first is evicted —
  # load + generate has to fit in this window. Bumped 240 → 360 after a
  # local worker hit a 240.00s ReadTimeout mid-cold-load (Phase 21).
  deep_worker: 360
  fast_path: 180

# ─── Cache ─────────────────────────────────────────────────────────────
cache:
  enabled: true
  max_entries: 256
  ttl_seconds: 600

# ─── Search ────────────────────────────────────────────────────────────
search:
  backend: brave             # brave | searxng (future)
  max_results: 5
  cache_ttl_hours: 24

# ─── Knowledge base ────────────────────────────────────────────────────
kb:
  text_collection: "kb_text"
  image_collection: "kb_images"
  text_embedder: "nomic-embed-text"      # via Ollama /api/embed, 768-d
  image_model: "clip-ViT-B-32"           # via sentence-transformers, 512-d
  chunk_tokens: 1000
  chunk_overlap: 100
  dataset_paths:                         # overridden by KB_DATASET_PATHS env var
    - "/datasets/geology"                # container path; host = /mnt/user/knowledge/<topic>
    - "/datasets/botany"
    - "/datasets/bushcraft"
    - "/datasets/fishing"
    - "/datasets/first-aid"
    - "/datasets/wilderness-first-aid"
    - "/datasets/herbal-medicine"
    - "/datasets/hunting"
    - "/datasets/survival"
    - "/datasets/bjj"
    - "/datasets/mma"
    - "/datasets/powerapps"
    - "/datasets/servicenow"
  watcher_debounce_seconds: 2

  # Periodic reconcile pass for the global kb_text + kb_images
  # collections. Catches drift the watcher misses (container restarts,
  # KB_WATCHER_ENABLED=0 stretches, bulk deletes outside audrey,
  # atomic-rename patterns watchdog handles unreliably). One sweep
  # runs immediately at startup; subsequent sweeps fire every
  # `interval_s`. Per-user collections (`kb_user_text_*` /
  # `kb_user_images_*`) are NOT touched — the sqlite uploads index
  # reconciles those at startup. Admin trigger:
  # `POST /v1/admin/kb/reconcile` for ad-hoc sweeps between intervals.
  reconcile:
    enabled: true
    interval_s: 1800                     # 30 min default; lower = more aggressive

  # Per-user uploads (Phase 13). Landing dir is bind-mounted from the host.
  upload_root: "/data/uploads"
  max_upload_mb: 50                      # per-file cap
  max_user_bytes: 1073741824             # 1 GiB per-user quota

  # Phase 15: sqlite index over the per-user upload metadata. Qdrant is
  # still authoritative for the file's content; this is a fast index for
  # list + quota that doesn't require scrolling the whole collection.
  # Reconciled against Qdrant at startup.
  uploads_db_path: "/data/uploads.sqlite"

# ─── Tools (OpenAPI auto-discovery) ────────────────────────────────────
tools:
  enabled: true
  servers:                               # overridden by TOOL_SERVERS env var
    - "http://custom-tools:8001"
  max_rounds: 5

# ─── Complexity gate ───────────────────────────────────────────────────
complexity:
  token_threshold: 500                   # pasted content this large forces deep panel
  log_breakdown: false                   # when true, emit per-role token sums alongside each complexity line (Phase 6a investigation)
  # Phrases that force `audrey_auto` to the deep panel regardless of length.
  # The token gate above catches *long* prompts; these catch the "short prompt,
  # big ask" case (a 30-token "compare the top 3 X, thorough, think hard" reads
  # trivial to a length gate but wants multi-draft synthesis). Substring match
  # on the latest user message, case-insensitive. Keep these to UNAMBIGUOUS
  # depth cues — "analyze"/"compare" alone are too common (they'd send casual
  # one-liners to deep). Empty list = feature off. (Phase 22.)
  deep_intent_phrases:
    - "think hard"
    - "deep dive"
    - "in depth"
    - "in-depth"
    - "comprehensive"
    - "step by step"
    - "step-by-step"
    - "thorough"
    - "exhaustive"
    - "detailed analysis"

debug:
  log_incoming_payload: false            # when true, log role+content-length for every incoming chat message (Phase 6a OWUI shape investigation)
  log_incoming_payload_content: false    # when true, log first 500 chars of every incoming chat message — PII-bearing, leave off in normal operation

# ─── GPU concurrency ───────────────────────────────────────────────────
gpu:
  concurrency: 1                         # local-model semaphore; cloud bypasses

# ─── Per-user fairness (Phase 20) ──────────────────────────────────────
# Layer 1 (FairLocalGate): round-robin across users at the local-GPU
# acquire point. Cloud calls bypass. No knob — replaces the old GpuGate.
# Layer 2 (in-flight cap): bounds how many concurrent pipeline requests
# one user can hold across the whole pipeline. Soft — extra requests
# wait, never error.
fairness:
  max_inflight_per_user: 3               # concurrent requests per user
  max_tracked_users: 1024                # LRU cap on the in-flight registry

# ─── Passthrough virtual model ─────────────────────────────────────────
# audrey_passthrough/<concrete_model> forwards the request directly to
# Ollama with no classifier, no complexity gate, no banners. Both fair-
# scheduling layers (FairLocalGate, UserInflightRegistry) still fire so
# direct-Ollama clients can be brought under Audrey's GPU contention
# story. The prefix scheme lets clients pick the concrete model per
# request. /v1/models lists one entry per allowed concrete.
passthrough:
  enabled: true
  allowed_models:                        # concrete models clients may target
    - qwen3.6:35b-64k
    - qwen3-coder-next-64k:latest
  require_role: null                     # null | "admin" — gate by OWUI role

# ─── Classification pre-filter ─────────────────────────────────────────
classification:
  keyword_prefilter:
    enabled: true
  review_override:
    enabled: true                        # "review this code" → reasoning, not code
  web_search_regex_set: "default"        # matches time-sensitive / factual / current-info
